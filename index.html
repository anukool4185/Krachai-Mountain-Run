<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ แกลเลอรีกิจกรรม ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body.theme-pastel {
            background: linear-gradient(135deg, #fce7f3 0%, #dbeafe 25%, #fef3c7 50%, #dcfce7 75%, #f3e8ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            color: #333;
        }

        body.theme-dark {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #e8e8e8;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-effect {
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .theme-pastel .glass-effect {
            background: rgba(255, 255, 255, 0.7);
        }

        .theme-dark .glass-effect {
            background: rgba(20, 20, 20, 0.8);
            border-color: rgba(255, 27, 53, 0.3);
        }

        .gradient-text {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-dark .gradient-text {
            background: linear-gradient(135deg, #ff1b35, #ff6b9d, #ffd60a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card {
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .theme-pastel .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(254, 243, 199, 0.4));
        }

        .theme-dark .card {
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.9), rgba(35, 35, 35, 0.6));
        }

        .btn-primary {
            color: white;
            padding: 12px 24px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .theme-pastel .btn-primary {
            background: linear-gradient(135deg, #f472b6, #c084fc);
        }

        .theme-dark .btn-primary {
            background: linear-gradient(135deg, #ff1b35, #ff4757);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .image-card {
            cursor: pointer;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.6);
        }

        .theme-pastel .image-card {
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.15);
        }

        .theme-dark .image-card {
            box-shadow: 0 8px 20px rgba(255, 27, 53, 0.3);
            border-color: rgba(255, 27, 53, 0.3);
        }

        .image-card:hover {
            transform: translateY(-12px) scale(1.02);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-content {
            padding-bottom: 90px;
        }

        @media (min-width: 768px) {
            .main-content {
                padding-bottom: 32px;
            }
        }

        @media (max-width: 767px) {
            .hidden-mobile { display: none !important; }
        }

        @media (min-width: 768px) {
            .hidden-desktop { display: none !important; }
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .admin-panel {
            max-height: 70vh;
            overflow-y: auto;
        }

        .error-msg {
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid rgba(255, 0, 0, 0.3);
            color: #ff0000;
            padding: 16px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: bold;
            line-height: 1.6;
        }

        .success-msg {
            background: rgba(0, 200, 0, 0.1);
            border: 2px solid rgba(0, 200, 0, 0.3);
            color: #00aa00;
            padding: 16px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: bold;
        }

        .debug-info {
            background: rgba(100, 100, 200, 0.1);
            border: 2px solid rgba(100, 100, 200, 0.3);
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            margin-top: 10px;
            font-family: monospace;
        }

        .version {
            font-size: 11px;
            opacity: 0.7;
            margin-left: 8px;
        }
    </style>
</head>
<body class="theme-pastel">
    <!-- Header -->
    <header class="sticky top-0 z-40 glass-effect shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <div class="floating">
                    <h1 class="text-4xl font-bold">✨ <span class="gradient-text">แกลเลอรีกิจกรรม</span> ✨</h1>
                    <p class="text-sm mt-1 font-medium">💕 ชมรูปสวยๆ จากกิจกรรม 📸 <span class="version">v2.1.1</span></p>
                </div>
                
                <div class="hidden-mobile flex gap-2">
                    <button id="adminBtn" onclick="toggleAdmin()" class="btn-primary">🔐 Admin</button>
                    <button id="googleSignInBtn" class="btn-primary hidden">🔐 เข้าสู่ Google</button>
                    <button id="googleSignOutBtn" class="btn-primary hidden">👤 ออกจากระบบ</button>
                    <button onclick="toggleTheme()" class="btn-primary">🌓</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12 main-content">
        <!-- Gallery -->
        <div id="galleryView" class="space-y-8"></div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="hidden admin-panel space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-3xl font-bold">👤 Admin Panel</h2>
                <button onclick="toggleAdmin()" class="btn-primary">← ออก</button>
            </div>

            <!-- Google Account Info -->
            <div id="googleAccountInfo" class="card hidden">
                <h3 class="text-2xl font-bold gradient-text mb-4">📧 บัญชี Google</h3>
                <p id="emailDisplay" class="text-lg mb-4"></p>
                <div class="flex gap-2">
                    <button id="adminGoogleSignIn" onclick="handleSignIn()" class="btn-primary">🔐 เข้าสู่ Google</button>
                    <button id="adminGoogleSignOut" onclick="handleSignOut()" class="btn-primary hidden">👤 ออกจากระบบ</button>
                </div>
            </div>

            <!-- เลือกโฟลเดอร์ -->
            <div class="card">
                <h3 class="text-2xl font-bold gradient-text mb-4">📁 โฟลเดอร์กิจกรรม</h3>
                <div id="foldersList" class="space-y-2"></div>
                <button onclick="createNewFolder()" class="btn-primary mt-4 w-full">➕ สร้างโฟลเดอร์ใหม่</button>
            </div>

            <!-- สร้างโฟลเดอร์ย่อย -->
            <div id="subfolderSection" class="card hidden">
                <h3 class="text-2xl font-bold gradient-text mb-4">📂 โฟลเดอร์ย่อย</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="subfolderNameInput" placeholder="ชื่อโฟลเดอร์ย่อย" class="flex-1 px-4 py-2 border-2 rounded-xl" style="border-color: rgba(236, 72, 153, 0.3);">
                    <button onclick="createSubfolder()" class="btn-primary">➕ สร้าง</button>
                </div>
                <div id="subfolderList" class="space-y-2"></div>
            </div>

            <!-- อัพโหลดรูป -->
            <div id="uploadSection" class="card hidden">
                <h3 class="text-2xl font-bold gradient-text mb-4">📸 อัพโหลดรูป</h3>
                <div class="border-4 border-dashed rounded-2xl p-12 text-center cursor-pointer hover:opacity-80" 
                     onclick="document.getElementById('fileInput').click()"
                     ondrop="handleDrop(event)" 
                     ondragover="event.preventDefault()">
                    <p class="text-6xl mb-3">📤</p>
                    <p class="text-xl font-bold">ลากรูปมาที่นี่ หรือคลิก</p>
                    <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFileSelect(event)" style="display: none;">
                </div>
                <div id="imagePreview" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4"></div>
                <button id="uploadBtn" onclick="uploadFiles()" class="btn-primary w-full mt-4 hidden">✅ อัพโหลด</button>
            </div>
        </div>
    </main>

    <!-- Loading Modal -->
    <div id="loadingModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg p-6 text-center">
            <div class="spinner mx-auto mb-4"></div>
            <p id="loadingText" class="font-bold">กำลังโหลด...</p>
        </div>
    </div>

    <script>
        // ⚠️ ⚠️ ⚠️ ต้องแทนค่า 3 ตัวนี้ ⚠️ ⚠️ ⚠️
        
        // 1. CLIENT_ID - จาก Google Cloud Console → Credentials
        const CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com';
        
        // 2. API_KEY - จาก Google Cloud Console → Credentials
        const API_KEY = 'YOUR_API_KEY';
        
        // 3. FOLDER_ID - จาก Google Drive URL
        // https://drive.google.com/drive/folders/[ตัวนี้]
        const GOOGLE_DRIVE_FOLDER_ID = '1Ymln5xGCN2GjplQujJIcmHbOwFLAlMaI';

        const SCOPES = 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/spreadsheets';
        const ADMIN_PASSWORD = '434143';
        const VERSION = 'v2.1.1';

        let authToken = null;
        let gapi_loaded = false;
        let currentTheme = localStorage.getItem('theme') || 'pastel';
        let userEmail = null;
        let selectedFolderId = null;
        let isAdmin = false;
        let selectedFiles = [];

        window.onload = async () => {
            console.log('🚀 แกลเลอรีกิจกรรม ' + VERSION + ' เริ่มโหลด');
            console.log('📋 ตัวแปรที่ใช้:');
            console.log('  - CLIENT_ID:', CLIENT_ID);
            console.log('  - API_KEY:', API_KEY ? 'ตั้งค่าแล้ว' : 'ยังไม่ได้ตั้งค่า');
            console.log('  - FOLDER_ID:', GOOGLE_DRIVE_FOLDER_ID);
            
            initTheme();
            gapi.load('client', initializeGoogleAPI);
            document.getElementById('adminBtn').addEventListener('click', toggleAdmin);
            document.getElementById('googleSignInBtn').addEventListener('click', handleSignIn);
            document.getElementById('googleSignOutBtn').addEventListener('click', handleSignOut);
            
            // โหลดแกลเลอรี
            await loadGalleryForPublic();
        };

        function initTheme() {
            document.body.className = 'theme-' + currentTheme;
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'pastel' ? 'dark' : 'pastel';
            localStorage.setItem('theme', currentTheme);
            initTheme();
        }

        function toggleAdmin() {
            if (!isAdmin) {
                const password = prompt('🔐 ใส่รหัส Admin:');
                if (password === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('adminPanel').classList.remove('hidden');
                    document.getElementById('galleryView').classList.add('hidden');
                    document.getElementById('googleSignInBtn').classList.remove('hidden');
                    document.getElementById('adminBtn').textContent = '← ออก';
                    showNotification('✅ เข้า Admin สำเร็จ', 'success');
                    initializeAdminPanel();
                } else if (password !== null) {
                    showNotification('❌ รหัสไม่ถูกต้อง!', 'error');
                }
            } else {
                isAdmin = false;
                document.getElementById('adminPanel').classList.add('hidden');
                document.getElementById('galleryView').classList.remove('hidden');
                document.getElementById('googleSignInBtn').classList.add('hidden');
                document.getElementById('adminBtn').textContent = '🔐 Admin';
                showNotification('✅ ออก Admin', 'success');
            }
        }

        async function initializeGoogleAPI() {
            try {
                console.log('⚙️ กำลังเตรียม Google API...');
                
                if (API_KEY === 'YOUR_API_KEY') {
                    console.error('❌ API_KEY ยังไม่ได้ตั้งค่า');
                    return;
                }

                await gapi.client.init({
                    apiKey: API_KEY,
                    clientId: CLIENT_ID,
                    scope: SCOPES,
                    discoveryDocs: [
                        'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest',
                        'https://www.googleapis.com/discovery/v1/apis/sheets/v4/rest'
                    ]
                });
                gapi_loaded = true;
                console.log('✅ Google API เตรียมพร้อมแล้ว');
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
                showNotification('❌ ข้อผิดพลาด: ' + error.message, 'error');
            }
        }

        function initializeAdminPanel() {
            document.getElementById('googleAccountInfo').classList.remove('hidden');
        }

        async function handleSignIn() {
            if (!gapi_loaded) {
                showNotification('⏳ กำลังโหลด Google API...', 'loading');
                setTimeout(handleSignIn, 1000);
                return;
            }

            try {
                console.log('🔐 กำลังเข้าสู่ Google...');
                const response = await gapi.auth2.getAuthInstance().signIn();
                await handleAuthSuccess();
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
                showNotification('❌ ไม่สามารถเข้าสู่ระบบ: ' + error.message, 'error');
            }
        }

        async function handleAuthSuccess() {
            const auth = gapi.auth2.getAuthInstance();
            const profile = auth.currentUser.get().getBasicProfile();
            userEmail = profile.getEmail();
            authToken = gapi.auth.getToken().access_token;

            console.log('✅ เข้าสู่ระบบแล้ว:', userEmail);

            document.getElementById('emailDisplay').textContent = `📧 ${userEmail}`;
            document.getElementById('adminGoogleSignIn').classList.add('hidden');
            document.getElementById('adminGoogleSignOut').classList.remove('hidden');
            document.getElementById('googleSignInBtn').classList.add('hidden');
            document.getElementById('googleSignOutBtn').classList.remove('hidden');

            showNotification(`✅ เข้าสู่ระบบแล้ว: ${userEmail}`, 'success');
            await loadFolders();
        }

        function handleSignOut() {
            gapi.auth2.getAuthInstance().signOut().then(() => {
                userEmail = null;
                authToken = null;
                document.getElementById('adminGoogleSignIn').classList.remove('hidden');
                document.getElementById('adminGoogleSignOut').classList.add('hidden');
                document.getElementById('googleSignInBtn').classList.remove('hidden');
                document.getElementById('googleSignOutBtn').classList.add('hidden');
                console.log('✅ ออกจากระบบแล้ว');
                showNotification('✅ ออกจากระบบสำเร็จ', 'success');
            });
        }

        async function loadGalleryForPublic() {
            try {
                console.log('📸 กำลังโหลดแกลเลอรี...');
                
                // ⚠️ ตรวจสอบว่าแทนค่า API_KEY แล้ว
                if (API_KEY === 'YOUR_API_KEY') {
                    document.getElementById('galleryView').innerHTML = `
                        <div class="error-msg">
                            ❌ <strong>ต้องแทนค่า API_KEY ก่อน!</strong><br><br>
                            📝 ขั้นตอน:<br>
                            1. ไปที่ Google Cloud Console<br>
                            2. Credentials → API Key<br>
                            3. Copy API Key<br>
                            4. เปิดไฟล์ index.html<br>
                            5. แทน 'YOUR_API_KEY' ด้วย API Key ที่คัดลอก<br>
                            6. บันทึกไฟล์<br>
                            7. Refresh เบราว์เซอร์<br><br>
                            💡 ป้องกัน: ใช้ API_KEY ที่ได้รับอนุญาตให้ Drive API เท่านั้น
                        </div>
                    `;
                    console.error('❌ API_KEY ยังไม่ได้ตั้งค่า');
                    return;
                }

                // ⚠️ ตรวจสอบ Folder ID
                if (!GOOGLE_DRIVE_FOLDER_ID || GOOGLE_DRIVE_FOLDER_ID === 'YOUR_FOLDER_ID') {
                    document.getElementById('galleryView').innerHTML = `
                        <div class="error-msg">
                            ❌ <strong>Folder ID ไม่ถูกต้อง!</strong><br><br>
                            📝 วิธีหาได้:<br>
                            1. เปิด Google Drive<br>
                            2. คลิกขวาโฟลเดอร์<br>
                            3. "Get link"<br>
                            4. Copy URL<br>
                            5. ค้นหา: https://drive.google.com/drive/folders/<strong>[ID]</strong><br>
                            6. แทน 'YOUR_FOLDER_ID' ด้วย ID นี้<br>
                            7. บันทึกไฟล์<br>
                            8. Refresh เบราว์เซอร์
                        </div>
                    `;
                    console.error('❌ Folder ID ไม่ถูกต้อง');
                    return;
                }

                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files?q='${GOOGLE_DRIVE_FOLDER_ID}' in parents and mimeType='application/vnd.google-apps.folder'&fields=files(id,name)&key=${API_KEY}`
                );
                
                if (!response.ok) {
                    console.error('❌ API Error:', response.status, response.statusText);
                    
                    if (response.status === 403) {
                        throw new Error('Forbidden - ตรวจสอบ API Key และ Enable Drive API');
                    } else if (response.status === 404) {
                        throw new Error('Folder ไม่พบ - ตรวจสอบ Folder ID');
                    } else {
                        throw new Error(`API Error: ${response.status}`);
                    }
                }
                
                const data = await response.json();
                const folders = data.files || [];

                console.log('✅ พบโฟลเดอร์:', folders.length);

                if (folders.length === 0) {
                    document.getElementById('galleryView').innerHTML = `
                        <div class="success-msg">
                            ✅ การเชื่อมต่อ API สำเร็จแล้ว<br>
                            ⚠️ แต่ Folder นี้ยังไม่มีโฟลเดอร์ย่อย<br><br>
                            📝 เพื่อเพิ่มรูป:<br>
                            1. เข้า Admin (รหัส: 434143)<br>
                            2. คลิก "เข้าสู่ Google"<br>
                            3. สร้างโฟลเดอร์ใหม่<br>
                            4. สร้างโฟลเดอร์ย่อย<br>
                            5. อัพโหลดรูป
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (const folder of folders) {
                    const imagesResponse = await fetch(
                        `https://www.googleapis.com/drive/v3/files?q='${folder.id}' in parents and mimeType contains 'image/'&fields=files(id,name,webViewLink)&key=${API_KEY}`
                    );
                    const imagesData = await imagesResponse.json();
                    const images = imagesData.files || [];

                    console.log(`📁 ${folder.name}: ${images.length} รูป`);

                    if (images.length > 0) {
                        html += `
                            <div class="mb-16">
                                <div class="card mb-8">
                                    <h2 class="text-3xl font-bold gradient-text">📁 ${folder.name}</h2>
                                    <p class="text-gray-600 mt-2">${images.length} รูป</p>
                                </div>
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        `;
                        
                        images.forEach(img => {
                            const imageUrl = `https://drive.google.com/thumbnail?id=${img.id}&sz=w500`;
                            html += `
                                <div class="image-card" onclick="viewImage('${imageUrl}', '${img.name}')">
                                    <img src="${imageUrl}" alt="${img.name}" onerror="this.src='https://via.placeholder.com/200?text=Error'">
                                </div>
                            `;
                        });

                        html += `
                                </div>
                            </div>
                        `;
                    }
                }

                if (html === '') {
                    document.getElementById('galleryView').innerHTML = `
                        <div class="success-msg">
                            ✅ การเชื่อมต่อ API สำเร็จแล้ว<br>
                            ⚠️ พบโฟลเดอร์แต่ยังไม่มีรูป<br><br>
                            📝 เพื่อเพิ่มรูป:<br>
                            1. เข้า Admin (รหัส: 434143)<br>
                            2. คลิก "เข้าสู่ Google"<br>
                            3. สร้างโฟลเดอร์ใหม่ (หรือเลือกที่มี)<br>
                            4. สร้างโฟลเดอร์ย่อย<br>
                            5. อัพโหลดรูป
                        </div>
                    `;
                } else {
                    document.getElementById('galleryView').innerHTML = html;
                    console.log('✅ แกลเลอรีโหลดสำเร็จ');
                }
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
                document.getElementById('galleryView').innerHTML = `
                    <div class="error-msg">
                        ❌ <strong>ข้อผิดพลาด:</strong> ${error.message}<br><br>
                        🔍 <strong>ตรวจสอบ:</strong><br>
                        1. API_KEY - ต้องแทนค่า<br>
                        2. Drive API - ต้อง Enable<br>
                        3. Folder ID - ต้องถูกต้อง<br>
                        4. OAuth Consent Screen - ต้องตั้งค่า<br><br>
                        💡 เปิด Browser Console (F12) เพื่อดู Error ทั้งหมด
                    </div>
                `;
            }
        }

        async function loadFolders() {
            try {
                showLoading(true, 'กำลังโหลดโฟลเดอร์...');
                console.log('📁 กำลังโหลดโฟลเดอร์ทั้งหมด...');
                
                const response = await gapi.client.drive.files.list({
                    q: "mimeType='application/vnd.google-apps.folder' and trashed=false",
                    spaces: 'drive',
                    fields: 'files(id, name)',
                    pageSize: 100
                });

                const folders = response.result.files || [];
                const foldersList = document.getElementById('foldersList');
                
                console.log('✅ พบโฟลเดอร์:', folders.length);

                if (folders.length === 0) {
                    foldersList.innerHTML = '<p class="text-gray-500">ยังไม่มีโฟลเดอร์</p>';
                } else {
                    foldersList.innerHTML = folders.map(folder => `
                        <div class="p-3 bg-opacity-50 rounded-lg flex justify-between items-center cursor-pointer hover:opacity-80" 
                             onclick="selectFolder('${folder.id}', '${folder.name}')">
                            <span>📁 ${folder.name}</span>
                            <button onclick="event.stopPropagation(); deleteFolder('${folder.id}')" class="text-red-500">🗑️</button>
                        </div>
                    `).join('');
                }

                showLoading(false);
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
                showNotification('❌ ข้อผิดพลาด: ' + error.message, 'error');
                showLoading(false);
            }
        }

        async function createNewFolder() {
            const name = prompt('ชื่อโฟลเดอร์ใหม่:');
            if (!name) return;

            try {
                showLoading(true, 'กำลังสร้างโฟลเดอร์...');
                console.log('📁 สร้างโฟลเดอร์:', name);

                const fileMetadata = {
                    name: name,
                    mimeType: 'application/vnd.google-apps.folder'
                };

                await gapi.client.drive.files.create({
                    resource: fileMetadata,
                    fields: 'id'
                });

                console.log('✅ สร้างโฟลเดอร์สำเร็จ');
                showNotification('✅ สร้างโฟลเดอร์สำเร็จ!', 'success');
                await loadFolders();
                showLoading(false);
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
                showNotification('❌ ข้อผิดพลาด: ' + error.message, 'error');
                showLoading(false);
            }
        }

        async function deleteFolder(folderId) {
            if (!confirm('ต้องการลบโฟลเดอร์นี้?')) return;

            try {
                showLoading(true, 'กำลังลบโฟลเดอร์...');
                console.log('🗑️ ลบโฟลเดอร์:', folderId);

                await gapi.client.drive.files.delete({ fileId: folderId });

                console.log('✅ ลบโฟลเดอร์สำเร็จ');
                showNotification('✅ ลบโฟลเดอร์สำเร็จ!', 'success');
                await loadFolders();
                document.getElementById('subfolderSection').classList.add('hidden');
                document.getElementById('uploadSection').classList.add('hidden');
                selectedFolderId = null;
                showLoading(false);
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
                showNotification('❌ ข้อผิดพลาด: ' + error.message, 'error');
                showLoading(false);
            }
        }

        async function selectFolder(folderId, folderName) {
            selectedFolderId = folderId;
            console.log('✅ เลือกโฟลเดอร์:', folderName);
            showNotification(`✅ เลือกโฟลเดอร์: ${folderName}`, 'success');
            
            document.getElementById('subfolderSection').classList.remove('hidden');
            document.getElementById('uploadSection').classList.remove('hidden');

            await loadSubfolders();
        }

        async function createSubfolder() {
            if (!selectedFolderId) {
                showNotification('⚠️ เลือกโฟลเดอร์ก่อน', 'warning');
                return;
            }

            const name = document.getElementById('subfolderNameInput').value.trim();
            if (!name) {
                showNotification('⚠️ ใส่ชื่อโฟลเดอร์ย่อย', 'warning');
                return;
            }

            try {
                showLoading(true, 'กำลังสร้างโฟลเดอร์ย่อย...');
                console.log('📂 สร้างโฟลเดอร์ย่อย:', name);

                const fileMetadata = {
                    name: name,
                    mimeType: 'application/vnd.google-apps.folder',
                    parents: [selectedFolderId]
                };

                await gapi.client.drive.files.create({
                    resource: fileMetadata,
                    fields: 'id'
                });

                document.getElementById('subfolderNameInput').value = '';
                console.log('✅ สร้างโฟลเดอร์ย่อยสำเร็จ');
                showNotification('✅ สร้างโฟลเดอร์ย่อยสำเร็จ!', 'success');
                await loadSubfolders();
                showLoading(false);
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
                showNotification('❌ ข้อผิดพลาด: ' + error.message, 'error');
                showLoading(false);
            }
        }

        async function loadSubfolders() {
            try {
                console.log('📂 กำลังโหลดโฟลเดอร์ย่อย...');
                const response = await gapi.client.drive.files.list({
                    q: `'${selectedFolderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,
                    spaces: 'drive',
                    fields: 'files(id, name)',
                    pageSize: 100
                });

                const subfolders = response.result.files || [];
                const list = document.getElementById('subfolderList');

                console.log('✅ พบโฟลเดอร์ย่อย:', subfolders.length);

                if (subfolders.length === 0) {
                    list.innerHTML = '<p class="text-gray-500">ยังไม่มีโฟลเดอร์ย่อย</p>';
                } else {
                    list.innerHTML = subfolders.map(folder => `
                        <div class="p-3 bg-opacity-50 rounded-lg flex justify-between items-center">
                            <span>📂 ${folder.name}</span>
                            <button onclick="deleteSubfolder('${folder.id}')" class="text-red-500">🗑️</button>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
            }
        }

        async function deleteSubfolder(folderId) {
            if (!confirm('ต้องการลบโฟลเดอร์ย่อยนี้?')) return;

            try {
                console.log('🗑️ ลบโฟลเดอร์ย่อย:', folderId);
                await gapi.client.drive.files.delete({ fileId: folderId });
                console.log('✅ ลบโฟลเดอร์ย่อยสำเร็จ');
                showNotification('✅ ลบโฟลเดอร์ย่อยสำเร็จ!', 'success');
                await loadSubfolders();
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
                showNotification('❌ ข้อผิดพลาด: ' + error.message, 'error');
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            handleFileSelect({ target: { files: e.dataTransfer.files } });
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
            if (files.length === 0) {
                showNotification('⚠️ เลือกรูปภาพเท่านั้น', 'warning');
                return;
            }

            console.log('📸 เลือกรูป:', files.length);

            const preview = document.getElementById('imagePreview');
            preview.innerHTML = files.map((file, index) => `
                <div class="relative">
                    <img src="${URL.createObjectURL(file)}" class="w-full h-24 object-cover rounded-lg border-2">
                    <button onclick="removeFile(${index})" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-5 h-5 text-xs">✕</button>
                </div>
            `).join('');

            selectedFiles = files;
            document.getElementById('uploadBtn').classList.remove('hidden');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            const e = { target: { files: selectedFiles } };
            handleFileSelect(e);
        }

        async function uploadFiles() {
            if (!selectedFolderId) {
                showNotification('⚠️ เลือกโฟลเดอร์ก่อน', 'warning');
                return;
            }

            if (!selectedFiles || selectedFiles.length === 0) {
                showNotification('⚠️ เลือกรูปภาพ', 'warning');
                return;
            }

            try {
                showLoading(true, `กำลังอัพโหลด ${selectedFiles.length} รูป...`);
                console.log('📸 อัพโหลด:', selectedFiles.length, 'รูป');

                for (const file of selectedFiles) {
                    const metadata = {
                        name: file.name,
                        parents: [selectedFolderId],
                        mimeType: file.type
                    };

                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', file);

                    await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + authToken },
                        body: form
                    });
                }

                selectedFiles = [];
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('uploadBtn').classList.add('hidden');

                console.log('✅ อัพโหลดสำเร็จ');
                showNotification('✅ อัพโหลดสำเร็จ!', 'success');
                showLoading(false);
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
                showNotification('❌ ข้อผิดพลาด: ' + error.message, 'error');
                showLoading(false);
            }
        }

        function viewImage(url, name) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-2xl max-w-2xl w-full max-h-80vh overflow-auto">
                    <img src="${url}" alt="${name}" class="w-full h-auto rounded-t-2xl">
                    <div class="p-4 flex gap-2">
                        <a href="${url}" download="${name}" class="flex-1 btn-primary text-center">⬇️ บันทึก</a>
                        <button onclick="this.closest('.fixed').remove()" class="flex-1 bg-gray-300 text-gray-800 py-2 rounded-lg">ปิด</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            modal.onclick = (e) => e.target === modal && modal.remove();
        }

        function showNotification(msg, type = 'info') {
            const bgColor = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                warning: 'bg-yellow-500',
                loading: 'bg-blue-500',
                info: 'bg-blue-500'
            }[type] || 'bg-blue-500';

            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
            notification.textContent = msg;
            document.body.appendChild(notification);

            setTimeout(() => notification.remove(), 3000);
        }

        function showLoading(show, text = 'กำลังโหลด...') {
            const modal = document.getElementById('loadingModal');
            if (show) {
                document.getElementById('loadingText').textContent = text;
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
