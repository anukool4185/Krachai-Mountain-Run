<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ แกลเลอรีกิจกรรม ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <style>
        * { box-sizing: border-box; }

        body.theme-pastel {
            background: linear-gradient(135deg, #fce7f3 0%, #dbeafe 25%, #fef3c7 50%, #dcfce7 75%, #f3e8ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            color: #333;
        }

        body.theme-dark {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #e8e8e8;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-effect {
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .theme-pastel .glass-effect {
            background: rgba(255, 255, 255, 0.7);
        }

        .theme-dark .glass-effect {
            background: rgba(20, 20, 20, 0.8);
            border-color: rgba(255, 27, 53, 0.3);
        }

        .gradient-text {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-dark .gradient-text {
            background: linear-gradient(135deg, #ff1b35, #ff6b9d, #ffd60a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card {
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .theme-pastel .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(254, 243, 199, 0.4));
        }

        .theme-dark .card {
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.9), rgba(35, 35, 35, 0.6));
        }

        .btn-primary {
            color: white;
            padding: 12px 24px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .theme-pastel .btn-primary {
            background: linear-gradient(135deg, #f472b6, #c084fc);
        }

        .theme-dark .btn-primary {
            background: linear-gradient(135deg, #ff1b35, #ff4757);
        }

        .btn-primary:hover { transform: translateY(-2px); }

        .image-card {
            cursor: pointer;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.6);
        }

        .image-card:hover {
            transform: translateY(-12px) scale(1.02);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-content { padding-bottom: 90px; }

        @media (min-width: 768px) {
            .main-content { padding-bottom: 32px; }
        }

        @media (max-width: 767px) {
            .hidden-mobile { display: none !important; }
        }

        @media (min-width: 768px) {
            .hidden-desktop { display: none !important; }
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .setup-modal {
            background: linear-gradient(135deg, #fce7f3, #f3e8ff);
            border: 3px solid #ec4899;
        }

        .theme-dark .setup-modal {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border-color: #ff1b35;
        }

        .setup-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ec4899;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 12px;
            font-family: monospace;
        }

        .theme-dark .setup-input {
            background: #333;
            color: #fff;
            border-color: #ff1b35;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="theme-pastel">
    <!-- Setup Modal -->
    <div id="setupModal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
        <div class="setup-modal rounded-3xl max-w-md w-full p-8">
            <h1 class="text-3xl font-bold gradient-text mb-6">⚙️ ตั้งค่าครั้งแรก</h1>
            
            <div class="mb-6">
                <label class="block font-bold mb-2">📋 API_KEY</label>
                <input type="password" id="setupApiKey" class="setup-input" placeholder="AIza...">
                <p class="text-xs opacity-70 mb-3">จาก Google Cloud Console → Credentials</p>
                
                <label class="block font-bold mb-2">🔐 CLIENT_ID</label>
                <input type="text" id="setupClientId" class="setup-input" placeholder="abcd...apps.googleusercontent.com">
                <p class="text-xs opacity-70 mb-3">จาก Google Cloud Console → Credentials</p>
                
                <label class="block font-bold mb-2">📁 FOLDER_ID</label>
                <input type="text" id="setupFolderId" class="setup-input" placeholder="1Ymln...">
                <p class="text-xs opacity-70">จาก Google Drive → URL ของโฟลเดอร์</p>
            </div>

            <div class="flex gap-2">
                <button onclick="toggleShowApiKey()" class="flex-1 btn-primary opacity-75">👁️ แสดง</button>
                <button onclick="saveSetup()" class="flex-1 btn-primary">✅ บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 glass-effect shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <div class="floating">
                    <h1 class="text-4xl font-bold">✨ <span class="gradient-text">แกลเลอรีกิจกรรม</span> ✨</h1>
                    <p class="text-sm mt-1 font-medium">💕 ชมรูปสวยๆ จากกิจกรรม 📸 <span class="version text-xs opacity-70">(v2.2)</span></p>
                </div>
                
                <div class="hidden-mobile flex gap-2">
                    <button onclick="openSetup()" class="btn-primary text-sm">⚙️ ตั้งค่า</button>
                    <button id="adminBtn" onclick="toggleAdmin()" class="btn-primary">🔐 Admin</button>
                    <button id="googleSignInBtn" class="btn-primary hidden">🔐 เข้าสู่ Google</button>
                    <button id="googleSignOutBtn" class="btn-primary hidden">👤 ออก</button>
                    <button onclick="toggleTheme()" class="btn-primary">🌓</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12 main-content">
        <div id="galleryView" class="space-y-8"></div>
        <div id="adminPanel" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-3xl font-bold">👤 Admin Panel</h2>
                <button onclick="toggleAdmin()" class="btn-primary">← ออก</button>
            </div>
            <div id="googleAccountInfo" class="card hidden">
                <h3 class="text-2xl font-bold gradient-text mb-4">📧 บัญชี Google</h3>
                <p id="emailDisplay" class="text-lg mb-4"></p>
                <div class="flex gap-2">
                    <button id="adminGoogleSignIn" onclick="handleSignIn()" class="btn-primary">🔐 เข้าสู่ Google</button>
                    <button id="adminGoogleSignOut" onclick="handleSignOut()" class="btn-primary hidden">👤 ออก</button>
                </div>
            </div>
            <div class="card">
                <h3 class="text-2xl font-bold gradient-text mb-4">📁 โฟลเดอร์กิจกรรม</h3>
                <div id="foldersList" class="space-y-2"></div>
                <button onclick="createNewFolder()" class="btn-primary mt-4 w-full">➕ สร้างโฟลเดอร์ใหม่</button>
            </div>
            <div id="subfolderSection" class="card hidden">
                <h3 class="text-2xl font-bold gradient-text mb-4">📂 โฟลเดอร์ย่อย</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="subfolderNameInput" placeholder="ชื่อโฟลเดอร์ย่อย" class="flex-1 px-4 py-2 border-2 rounded-xl" style="border-color: rgba(236, 72, 153, 0.3);">
                    <button onclick="createSubfolder()" class="btn-primary">➕ สร้าง</button>
                </div>
                <div id="subfolderList" class="space-y-2"></div>
            </div>
            <div id="uploadSection" class="card hidden">
                <h3 class="text-2xl font-bold gradient-text mb-4">📸 อัพโหลดรูป</h3>
                <div class="border-4 border-dashed rounded-2xl p-12 text-center cursor-pointer" 
                     onclick="document.getElementById('fileInput').click()"
                     ondrop="handleDrop(event)" ondragover="event.preventDefault()">
                    <p class="text-6xl mb-3">📤</p>
                    <p class="text-xl font-bold">ลากรูปมาที่นี่ หรือคลิก</p>
                    <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFileSelect(event)" style="display: none;">
                </div>
                <div id="imagePreview" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4"></div>
                <button id="uploadBtn" onclick="uploadFiles()" class="btn-primary w-full mt-4 hidden">✅ อัพโหลด</button>
            </div>
        </div>
    </main>

    <script>
        const SCOPES = 'https://www.googleapis.com/auth/drive';
        const ADMIN_PASSWORD = '434143';
        const VERSION = 'v2.2';

        let config = {
            API_KEY: localStorage.getItem('gallery_api_key') || '',
            CLIENT_ID: localStorage.getItem('gallery_client_id') || '',
            GOOGLE_DRIVE_FOLDER_ID: localStorage.getItem('gallery_folder_id') || '1Ymln5xGCN2GjplQujJIcmHbOwFLAlMaI'
        };

        let authToken = null, gapi_loaded = false, currentTheme = localStorage.getItem('theme') || 'pastel';
        let userEmail = null, selectedFolderId = null, isAdmin = false, selectedFiles = [];

        window.onload = async () => {
            initTheme();
            
            // ตรวจสอบ Config
            if (!config.API_KEY || !config.CLIENT_ID) {
                document.getElementById('setupModal').classList.remove('hidden');
                document.getElementById('setupApiKey').value = config.API_KEY;
                document.getElementById('setupClientId').value = config.CLIENT_ID;
                document.getElementById('setupFolderId').value = config.GOOGLE_DRIVE_FOLDER_ID;
                return;
            }

            document.getElementById('setupModal').classList.add('hidden');
            gapi.load('client', initializeGoogleAPI);
            await loadGalleryForPublic();
        };

        function initTheme() {
            document.body.className = 'theme-' + currentTheme;
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'pastel' ? 'dark' : 'pastel';
            localStorage.setItem('theme', currentTheme);
            initTheme();
        }

        function openSetup() {
            document.getElementById('setupModal').classList.remove('hidden');
        }

        function toggleShowApiKey() {
            const input = document.getElementById('setupApiKey');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function saveSetup() {
            const apiKey = document.getElementById('setupApiKey').value.trim();
            const clientId = document.getElementById('setupClientId').value.trim();
            const folderId = document.getElementById('setupFolderId').value.trim();

            if (!apiKey || !clientId || !folderId) {
                alert('⚠️ กรุณากรอกทุกช่อง');
                return;
            }

            localStorage.setItem('gallery_api_key', apiKey);
            localStorage.setItem('gallery_client_id', clientId);
            localStorage.setItem('gallery_folder_id', folderId);

            config.API_KEY = apiKey;
            config.CLIENT_ID = clientId;
            config.GOOGLE_DRIVE_FOLDER_ID = folderId;

            document.getElementById('setupModal').classList.add('hidden');
            alert('✅ บันทึกการตั้งค่าสำเร็จ! Refresh เบราว์เซอร์ครั้งเดียว');
            location.reload();
        }

        async function initializeGoogleAPI() {
            try {
                await gapi.client.init({
                    apiKey: config.API_KEY,
                    clientId: config.CLIENT_ID,
                    scope: SCOPES,
                    discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']
                });
                gapi_loaded = true;
            } catch (error) {
                console.error('❌ Google API Error:', error);
            }
        }

        function toggleAdmin() {
            if (!isAdmin) {
                const password = prompt('🔐 ใส่รหัส Admin:');
                if (password === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('adminPanel').classList.remove('hidden');
                    document.getElementById('galleryView').classList.add('hidden');
                    document.getElementById('googleSignInBtn').classList.remove('hidden');
                    document.getElementById('adminBtn').textContent = '← ออก';
                    document.getElementById('googleAccountInfo').classList.remove('hidden');
                } else if (password !== null) {
                    alert('❌ รหัสไม่ถูกต้อง!');
                }
            } else {
                isAdmin = false;
                document.getElementById('adminPanel').classList.add('hidden');
                document.getElementById('galleryView').classList.remove('hidden');
                document.getElementById('googleSignInBtn').classList.add('hidden');
                document.getElementById('adminBtn').textContent = '🔐 Admin';
            }
        }

        async function handleSignIn() {
            if (!gapi_loaded) {
                setTimeout(handleSignIn, 1000);
                return;
            }
            try {
                const response = await gapi.auth2.getAuthInstance().signIn();
                const auth = gapi.auth2.getAuthInstance();
                const profile = auth.currentUser.get().getBasicProfile();
                userEmail = profile.getEmail();
                authToken = gapi.auth.getToken().access_token;

                document.getElementById('emailDisplay').textContent = `📧 ${userEmail}`;
                document.getElementById('adminGoogleSignIn').classList.add('hidden');
                document.getElementById('adminGoogleSignOut').classList.remove('hidden');
                document.getElementById('googleSignInBtn').classList.add('hidden');
                document.getElementById('googleSignOutBtn').classList.remove('hidden');

                await loadFolders();
            } catch (error) {
                alert('❌ ข้อผิดพลาด: ' + error.message);
            }
        }

        function handleSignOut() {
            gapi.auth2.getAuthInstance().signOut().then(() => {
                userEmail = null;
                authToken = null;
                document.getElementById('adminGoogleSignIn').classList.remove('hidden');
                document.getElementById('adminGoogleSignOut').classList.add('hidden');
                document.getElementById('googleSignInBtn').classList.remove('hidden');
                document.getElementById('googleSignOutBtn').classList.add('hidden');
            });
        }

        async function loadGalleryForPublic() {
            try {
                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files?q='${config.GOOGLE_DRIVE_FOLDER_ID}' in parents and mimeType='application/vnd.google-apps.folder'&fields=files(id,name)&key=${config.API_KEY}`
                );
                
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                
                const data = await response.json();
                const folders = data.files || [];

                let html = '';
                for (const folder of folders) {
                    const imagesResponse = await fetch(
                        `https://www.googleapis.com/drive/v3/files?q='${folder.id}' in parents and mimeType contains 'image/'&fields=files(id,name)&key=${config.API_KEY}`
                    );
                    const imagesData = await imagesResponse.json();
                    const images = imagesData.files || [];

                    if (images.length > 0) {
                        html += `<div class="mb-16">
                            <div class="card mb-8">
                                <h2 class="text-3xl font-bold gradient-text">📁 ${folder.name}</h2>
                                <p class="text-gray-600 mt-2">${images.length} รูป</p>
                            </div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">`;
                        
                        images.forEach(img => {
                            const imageUrl = `https://drive.google.com/thumbnail?id=${img.id}&sz=w500`;
                            html += `<div class="image-card" onclick="viewImage('${imageUrl}', '${img.name}')">
                                <img src="${imageUrl}" alt="${img.name}" onerror="this.src='https://via.placeholder.com/200?text=Error'">
                            </div>`;
                        });
                        html += `</div></div>`;
                    }
                }

                document.getElementById('galleryView').innerHTML = html || '<p class="text-center text-2xl">📸 ยังไม่มีรูปภาพ</p>';
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
                document.getElementById('galleryView').innerHTML = '<p class="text-center text-red-500">❌ ข้อผิดพลาด: ' + error.message + '</p>';
            }
        }

        async function loadFolders() {
            try {
                const response = await gapi.client.drive.files.list({
                    q: "mimeType='application/vnd.google-apps.folder' and trashed=false",
                    spaces: 'drive',
                    fields: 'files(id, name)',
                    pageSize: 100
                });

                const folders = response.result.files || [];
                const foldersList = document.getElementById('foldersList');
                
                foldersList.innerHTML = folders.map(folder => `
                    <div class="p-3 bg-opacity-50 rounded-lg flex justify-between items-center cursor-pointer hover:opacity-80" 
                         onclick="selectFolder('${folder.id}', '${folder.name}')">
                        <span>📁 ${folder.name}</span>
                        <button onclick="event.stopPropagation(); deleteFolder('${folder.id}')" class="text-red-500">🗑️</button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
            }
        }

        async function createNewFolder() {
            const name = prompt('ชื่อโฟลเดอร์ใหม่:');
            if (!name) return;

            try {
                await gapi.client.drive.files.create({
                    resource: { name: name, mimeType: 'application/vnd.google-apps.folder' },
                    fields: 'id'
                });
                await loadFolders();
            } catch (error) {
                alert('❌ ข้อผิดพลาด: ' + error.message);
            }
        }

        async function deleteFolder(folderId) {
            if (!confirm('ต้องการลบโฟลเดอร์นี้?')) return;
            try {
                await gapi.client.drive.files.delete({ fileId: folderId });
                await loadFolders();
                document.getElementById('subfolderSection').classList.add('hidden');
                document.getElementById('uploadSection').classList.add('hidden');
            } catch (error) {
                alert('❌ ข้อผิดพลาด: ' + error.message);
            }
        }

        async function selectFolder(folderId, folderName) {
            selectedFolderId = folderId;
            document.getElementById('subfolderSection').classList.remove('hidden');
            document.getElementById('uploadSection').classList.remove('hidden');
            await loadSubfolders();
        }

        async function createSubfolder() {
            const name = document.getElementById('subfolderNameInput').value.trim();
            if (!name) {
                alert('⚠️ ใส่ชื่อโฟลเดอร์ย่อย');
                return;
            }

            try {
                await gapi.client.drive.files.create({
                    resource: { name: name, mimeType: 'application/vnd.google-apps.folder', parents: [selectedFolderId] },
                    fields: 'id'
                });
                document.getElementById('subfolderNameInput').value = '';
                await loadSubfolders();
            } catch (error) {
                alert('❌ ข้อผิดพลาด: ' + error.message);
            }
        }

        async function loadSubfolders() {
            try {
                const response = await gapi.client.drive.files.list({
                    q: `'${selectedFolderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,
                    fields: 'files(id, name)',
                    pageSize: 100
                });

                const subfolders = response.result.files || [];
                const list = document.getElementById('subfolderList');
                list.innerHTML = subfolders.map(folder => `
                    <div class="p-3 bg-opacity-50 rounded-lg flex justify-between items-center">
                        <span>📂 ${folder.name}</span>
                        <button onclick="deleteSubfolder('${folder.id}')" class="text-red-500">🗑️</button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('❌ ข้อผิดพลาด:', error);
            }
        }

        async function deleteSubfolder(folderId) {
            if (!confirm('ต้องการลบโฟลเดอร์ย่อยนี้?')) return;
            try {
                await gapi.client.drive.files.delete({ fileId: folderId });
                await loadSubfolders();
            } catch (error) {
                alert('❌ ข้อผิดพลาด: ' + error.message);
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            handleFileSelect({ target: { files: e.dataTransfer.files } });
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
            if (files.length === 0) {
                alert('⚠️ เลือกรูปภาพเท่านั้น');
                return;
            }

            const preview = document.getElementById('imagePreview');
            preview.innerHTML = files.map((file, index) => `
                <div class="relative">
                    <img src="${URL.createObjectURL(file)}" class="w-full h-24 object-cover rounded-lg border-2">
                    <button onclick="removeFile(${index})" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-5 h-5 text-xs">✕</button>
                </div>
            `).join('');

            selectedFiles = files;
            document.getElementById('uploadBtn').classList.remove('hidden');
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            handleFileSelect({ target: { files: selectedFiles } });
        }

        async function uploadFiles() {
            if (!selectedFolderId || !selectedFiles.length) {
                alert('⚠️ เลือกโฟลเดอร์และรูป');
                return;
            }

            try {
                for (const file of selectedFiles) {
                    const metadata = { name: file.name, parents: [selectedFolderId] };
                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', file);

                    await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + authToken },
                        body: form
                    });
                }

                selectedFiles = [];
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('uploadBtn').classList.add('hidden');
                alert('✅ อัพโหลดสำเร็จ!');
            } catch (error) {
                alert('❌ ข้อผิดพลาด: ' + error.message);
            }
        }

        function viewImage(url, name) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-2xl max-w-2xl w-full">
                    <img src="${url}" alt="${name}" class="w-full h-auto rounded-t-2xl">
                    <div class="p-4 flex gap-2">
                        <a href="${url}" download="${name}" class="flex-1 btn-primary text-center">⬇️ บันทึก</a>
                        <button onclick="this.closest('.fixed').remove()" class="flex-1 bg-gray-300 text-gray-800 py-2 rounded-lg">ปิด</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            modal.onclick = (e) => e.target === modal && modal.remove();
        }
    </script>
</body>
</html>
