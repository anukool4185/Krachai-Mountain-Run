<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ แกลเลอรีกิจกรรม ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }

        body.theme-pastel {
            background: linear-gradient(135deg, #fce7f3 0%, #dbeafe 25%, #fef3c7 50%, #dcfce7 75%, #f3e8ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            color: #333;
        }

        body.theme-dark {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #e8e8e8;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-effect {
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .theme-pastel .glass-effect {
            background: rgba(255, 255, 255, 0.7);
        }

        .theme-dark .glass-effect {
            background: rgba(20, 20, 20, 0.8);
            border-color: rgba(255, 27, 53, 0.3);
        }

        .gradient-text {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-dark .gradient-text {
            background: linear-gradient(135deg, #ff1b35, #ff6b9d, #ffd60a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card {
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .theme-pastel .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(254, 243, 199, 0.4));
        }

        .theme-dark .card {
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.9), rgba(35, 35, 35, 0.6));
        }

        .btn-primary {
            color: white;
            padding: 12px 24px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .theme-pastel .btn-primary {
            background: linear-gradient(135deg, #f472b6, #c084fc);
        }

        .theme-dark .btn-primary {
            background: linear-gradient(135deg, #ff1b35, #ff4757);
        }

        .btn-primary:hover { transform: translateY(-2px); }

        .image-card {
            cursor: pointer;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.6);
            height: 200px;
        }

        .image-card:hover {
            transform: translateY(-12px) scale(1.02);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .upload-area {
            border: 3px dashed rgba(236, 72, 153, 0.5);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: rgba(236, 72, 153, 1);
            background: rgba(236, 72, 153, 0.05);
        }

        .folder-btn {
            padding: 12px;
            border-radius: 12px;
            margin: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(236, 72, 153, 0.3);
        }

        .folder-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(236, 72, 153, 1);
        }

        .folder-btn.active {
            background: rgba(236, 72, 153, 0.2);
            border-color: rgba(236, 72, 153, 1);
            font-weight: bold;
        }
    </style>
</head>
<body class="theme-pastel">
    <!-- Header -->
    <header class="sticky top-0 z-40 glass-effect shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <div class="floating">
                    <h1 class="text-4xl font-bold">✨ <span class="gradient-text">แกลเลอรีกิจกรรม</span> ✨</h1>
                    <p class="text-sm mt-1 font-medium">💕 ชมรูปสวยๆ จากกิจกรรม 📸</p>
                    <p class="text-xs opacity-80 bg-gradient-to-r from-pink-300 to-purple-300 text-gray-800 px-3 py-1 rounded-full inline-block mt-2 font-bold">📦 v3.0 - ใช้งานได้เลย</p>
                </div>
                
                <div class="flex gap-2">
                    <button id="adminBtn" onclick="toggleAdmin()" class="btn-primary">🔐 Admin</button>
                    <button onclick="toggleTheme()" class="btn-primary">🌓</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <!-- Gallery View -->
        <div id="galleryView" class="space-y-8">
            <div class="card text-center">
                <h2 class="text-2xl font-bold gradient-text mb-4">📸 แกลเลอรีกิจกรรม</h2>
                <p class="mb-4">👤 ยังไม่มีรูปภาพ</p>
                <p class="text-sm text-gray-500">เข้า Admin เพื่ออัพโหลดรูป</p>
            </div>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="hidden space-y-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold gradient-text">👤 Admin Panel</h2>
                <button onclick="toggleAdmin()" class="btn-primary">← ออก</button>
            </div>

            <!-- สร้างโฟลเดอร์ -->
            <div class="card">
                <h3 class="text-2xl font-bold gradient-text mb-4">📁 โฟลเดอร์</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="newFolderName" placeholder="ชื่อโฟลเดอร์ใหม่" class="flex-1 px-4 py-2 border-2 border-pink-300 rounded-xl">
                    <button onclick="createFolder()" class="btn-primary">➕ สร้าง</button>
                </div>
                <div id="foldersList" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- อัพโหลดรูป -->
            <div class="card">
                <h3 class="text-2xl font-bold gradient-text mb-4">📸 อัพโหลดรูป</h3>
                
                <div class="upload-area" ondrop="handleDrop(event)" ondragover="event.preventDefault()">
                    <p class="text-4xl mb-2">📤</p>
                    <p class="text-lg font-bold">ลากรูปมาที่นี่ หรือ คลิก</p>
                    <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFileSelect(event)" style="display: none;">
                    <input type="text" placeholder="หรือใส่ URL รูปภาพ" id="imageUrl" class="mt-4 w-full px-4 py-2 border-2 border-pink-300 rounded-xl">
                    <button onclick="document.getElementById('fileInput').click()" class="btn-primary mt-4">📁 เลือกรูป</button>
                    <button onclick="addImageFromUrl()" class="btn-primary mt-2">🔗 เพิ่มจาก URL</button>
                </div>

                <div id="imagePreview" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6"></div>
                <button id="uploadBtn" onclick="uploadImages()" class="btn-primary w-full mt-4 hidden">✅ อัพโหลด</button>
            </div>
        </div>
    </main>

    <!-- Image Modal -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-2xl w-full relative">
            <button onclick="closeModal()" class="absolute top-2 right-2 text-3xl font-bold">✕</button>
            <img id="modalImage" src="" alt="" class="w-full h-auto rounded-t-2xl">
            <div class="p-4 flex gap-2">
                <a id="downloadBtn" download class="flex-1 btn-primary text-center">⬇️ บันทึก</a>
                <button onclick="closeModal()" class="flex-1 bg-gray-300 text-gray-800 py-3 rounded-lg font-bold">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = '434143';
        let currentTheme = localStorage.getItem('theme') || 'pastel';
        let isAdmin = false;
        let currentFolder = 'default';
        let selectedFiles = [];
        let galleries = JSON.parse(localStorage.getItem('galleries')) || {
            'default': { name: 'กิจกรรมทั่วไป', images: [] }
        };

        window.onload = () => {
            initTheme();
            loadGallery();
            updateFoldersList();
        };

        function initTheme() {
            document.body.className = 'theme-' + currentTheme;
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'pastel' ? 'dark' : 'pastel';
            localStorage.setItem('theme', currentTheme);
            initTheme();
        }

        function toggleAdmin() {
            if (!isAdmin) {
                const password = prompt('🔐 ใส่รหัส Admin:');
                if (password === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('adminPanel').classList.remove('hidden');
                    document.getElementById('galleryView').classList.add('hidden');
                    document.getElementById('adminBtn').textContent = '← ออก';
                    alert('✅ เข้า Admin สำเร็จ');
                } else if (password !== null) {
                    alert('❌ รหัสไม่ถูกต้อง');
                }
            } else {
                isAdmin = false;
                document.getElementById('adminPanel').classList.add('hidden');
                document.getElementById('galleryView').classList.remove('hidden');
                document.getElementById('adminBtn').textContent = '🔐 Admin';
                loadGallery();
            }
        }

        function createFolder() {
            const name = document.getElementById('newFolderName').value.trim();
            if (!name) {
                alert('⚠️ ใส่ชื่อโฟลเดอร์');
                return;
            }

            const id = 'folder_' + Date.now();
            galleries[id] = { name: name, images: [] };
            localStorage.setItem('galleries', JSON.stringify(galleries));
            document.getElementById('newFolderName').value = '';
            updateFoldersList();
            alert('✅ สร้างโฟลเดอร์สำเร็จ');
        }

        function updateFoldersList() {
            const list = document.getElementById('foldersList');
            list.innerHTML = Object.entries(galleries).map(([id, folder]) => `
                <div class="folder-btn ${id === currentFolder ? 'active' : ''}" onclick="selectFolder('${id}')">
                    📁 ${folder.name}
                    ${id !== 'default' ? `<button onclick="event.stopPropagation(); deleteFolder('${id}')" class="ml-2 text-red-500">🗑️</button>` : ''}
                </div>
            `).join('');
        }

        function selectFolder(id) {
            currentFolder = id;
            updateFoldersList();
        }

        function deleteFolder(id) {
            if (confirm('ต้องการลบโฟลเดอร์นี้?')) {
                delete galleries[id];
                currentFolder = 'default';
                localStorage.setItem('galleries', JSON.stringify(galleries));
                updateFoldersList();
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            handleFileSelect({ target: { files: e.dataTransfer.files } });
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
            selectedFiles = files;
            showPreview();
        }

        function addImageFromUrl() {
            const url = document.getElementById('imageUrl').value.trim();
            if (!url) {
                alert('⚠️ ใส่ URL รูปภาพ');
                return;
            }

            const images = galleries[currentFolder].images || [];
            images.push({
                id: Date.now(),
                src: url,
                name: url.split('/').pop() || 'image.jpg'
            });
            galleries[currentFolder].images = images;
            localStorage.setItem('galleries', JSON.stringify(galleries));
            document.getElementById('imageUrl').value = '';
            alert('✅ เพิ่มรูปสำเร็จ');
            loadGallery();
        }

        function showPreview() {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = selectedFiles.map((file, index) => `
                <div class="relative">
                    <img src="${URL.createObjectURL(file)}" class="w-full h-24 object-cover rounded-lg border-2">
                    <button onclick="removeFile(${index})" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-5 h-5 text-xs font-bold">✕</button>
                </div>
            `).join('');

            if (selectedFiles.length > 0) {
                document.getElementById('uploadBtn').classList.remove('hidden');
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            showPreview();
        }

        function uploadImages() {
            if (selectedFiles.length === 0) {
                alert('⚠️ เลือกรูปภาพก่อน');
                return;
            }

            const images = galleries[currentFolder].images || [];

            selectedFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    images.push({
                        id: Date.now() + Math.random(),
                        src: e.target.result,
                        name: file.name
                    });
                    galleries[currentFolder].images = images;
                    localStorage.setItem('galleries', JSON.stringify(galleries));
                };
                reader.readAsDataURL(file);
            });

            selectedFiles = [];
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('uploadBtn').classList.add('hidden');
            alert('✅ อัพโหลดรูปสำเร็จ');
            loadGallery();
        }

        function loadGallery() {
            let html = '';

            Object.entries(galleries).forEach(([id, folder]) => {
                if (folder.images && folder.images.length > 0) {
                    html += `
                        <div class="mb-16">
                            <div class="card mb-8">
                                <h2 class="text-3xl font-bold gradient-text">📁 ${folder.name}</h2>
                                <p class="text-gray-600 mt-2">${folder.images.length} รูป</p>
                            </div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    `;

                    folder.images.forEach(img => {
                        html += `
                            <div class="image-card" onclick="openModal('${img.src}', '${img.name}')">
                                <img src="${img.src}" alt="${img.name}" onerror="this.src='https://via.placeholder.com/200?text=Error'">
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                }
            });

            if (html === '') {
                html = `
                    <div class="card text-center">
                        <h2 class="text-2xl font-bold gradient-text mb-4">📸 แกลเลอรีกิจกรรม</h2>
                        <p class="mb-4">👤 ยังไม่มีรูปภาพ</p>
                        <p class="text-sm text-gray-500">เข้า Admin เพื่ออัพโหลดรูป</p>
                    </div>
                `;
            }

            document.getElementById('galleryView').innerHTML = html;
        }

        function openModal(url, name) {
            document.getElementById('modalImage').src = url;
            document.getElementById('downloadBtn').href = url;
            document.getElementById('downloadBtn').download = name;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }
    </script>
</body>
</html>
