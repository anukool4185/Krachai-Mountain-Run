<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ แกลเลอรีกิจกรรม ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        /* ============ PASTEL THEME ============ */
        body.theme-pastel {
            background: linear-gradient(135deg, #fce7f3 0%, #dbeafe 25%, #fef3c7 50%, #dcfce7 75%, #f3e8ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ============ DARK THEME ============ */
        body.theme-dark {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
        }

        body.theme-pastel {
            color: #333;
        }

        body.theme-dark {
            color: #e8e8e8;
        }

        /* ============ GLASS & CARD EFFECTS ============ */
        .glass-effect {
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .theme-pastel .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .theme-dark .glass-effect {
            background: rgba(20, 20, 20, 0.8);
            border-color: rgba(255, 27, 53, 0.3);
        }

        .gradient-text {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-dark .gradient-text {
            background: linear-gradient(135deg, #ff1b35, #ff6b9d, #ffd60a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .image-card {
            cursor: pointer;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.6);
        }

        .theme-pastel .image-card {
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.15);
        }

        .theme-dark .image-card {
            box-shadow: 0 8px 20px rgba(255, 27, 53, 0.3);
            border-color: rgba(255, 27, 53, 0.3);
        }

        .image-card:hover {
            transform: translateY(-12px) scale(1.02);
        }

        .theme-pastel .image-card:hover {
            box-shadow: 0 16px 35px rgba(236, 72, 153, 0.25);
            border-color: rgba(236, 72, 153, 0.3);
        }

        .theme-dark .image-card:hover {
            box-shadow: 0 16px 35px rgba(255, 27, 53, 0.4);
            border-color: rgba(255, 27, 53, 0.5);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
            backdrop-filter: blur(2px);
        }

        .theme-pastel .image-overlay {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.1), rgba(139, 92, 246, 0.1));
        }

        .theme-dark .image-overlay {
            background: linear-gradient(135deg, rgba(255, 27, 53, 0.2), rgba(0, 0, 0, 0.3));
        }

        .image-card:hover .image-overlay {
            opacity: 1;
        }

        .modal-overlay {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .theme-pastel .modal-content {
            background: linear-gradient(135deg, #fce7f3, #fef3c7);
        }

        .theme-dark .modal-content {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
        }

        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 40;
            backdrop-filter: blur(10px);
            border-top: 2px solid rgba(236, 72, 153, 0.2);
        }

        .theme-dark .sticky-footer {
            background: rgba(15, 15, 15, 0.85);
            border-top-color: rgba(255, 27, 53, 0.3);
        }

        .theme-pastel .sticky-footer {
            background: rgba(255, 255, 255, 0.85);
        }

        .main-content {
            padding-bottom: 90px;
        }

        @media (min-width: 768px) {
            .main-content {
                padding-bottom: 32px;
            }
        }

        .card {
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .theme-pastel .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(254, 243, 199, 0.4));
            box-shadow: 0 12px 30px rgba(236, 72, 153, 0.15);
        }

        .theme-dark .card {
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.9), rgba(35, 35, 35, 0.6));
            box-shadow: 0 12px 30px rgba(255, 27, 53, 0.2);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .theme-pastel .card:hover {
            box-shadow: 0 16px 40px rgba(236, 72, 153, 0.2);
        }

        .theme-dark .card:hover {
            box-shadow: 0 16px 40px rgba(255, 27, 53, 0.3);
        }

        .btn-primary {
            color: white;
            padding: 12px 24px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .theme-pastel .btn-primary {
            background: linear-gradient(135deg, #f472b6, #c084fc);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }

        .theme-dark .btn-primary {
            background: linear-gradient(135deg, #ff1b35, #ff4757);
            box-shadow: 0 4px 15px rgba(255, 27, 53, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .activity-title {
            font-size: 2rem;
            font-weight: 700;
        }

        .theme-pastel .activity-title {
            background: linear-gradient(135deg, #f472b6, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-dark .activity-title {
            background: linear-gradient(135deg, #ff1b35, #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (max-width: 767px) {
            .hidden-mobile { display: none !important; }
        }

        @media (min-width: 768px) {
            .hidden-desktop { display: none !important; }
        }

        .nav-link {
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .theme-pastel .nav-link.active {
            background: linear-gradient(135deg, #f472b6, #c084fc);
            color: white;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }

        .theme-dark .nav-link.active {
            background: linear-gradient(135deg, #ff1b35, #ff4757);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 27, 53, 0.4);
        }

        .theme-pastel .nav-link:not(.active) {
            color: #ec4899;
            background: rgba(244, 114, 182, 0.1);
        }

        .theme-dark .nav-link:not(.active) {
            color: #ff6b9d;
            background: rgba(255, 27, 53, 0.1);
        }

        .nav-link:hover {
            transform: translateY(-2px);
        }

        .theme-toggle {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .theme-pastel .theme-toggle {
            background: rgba(255, 107, 157, 0.2);
            color: #ec4899;
        }

        .theme-dark .theme-toggle {
            background: rgba(255, 27, 53, 0.2);
            color: #ff6b9d;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .pastel-pink {
            background: linear-gradient(135deg, #fce7f3, #fbcfe8) !important;
        }

        .pastel-blue {
            background: linear-gradient(135deg, #dbeafe, #bae6fd) !important;
        }

        .pastel-yellow {
            background: linear-gradient(135deg, #fef3c7, #fde68a) !important;
        }

        .pastel-green {
            background: linear-gradient(135deg, #dcfce7, #bbf7d0) !important;
        }

        .pastel-purple {
            background: linear-gradient(135deg, #f3e8ff, #e9d5ff) !important;
        }

        .theme-dark .dark-card-pink {
            background: linear-gradient(135deg, #2a1a24, #3a2a34) !important;
        }

        .theme-dark .dark-card-blue {
            background: linear-gradient(135deg, #1a2a3a, #2a3a4a) !important;
        }

        .theme-dark .dark-card-yellow {
            background: linear-gradient(135deg, #3a3a1a, #4a4a2a) !important;
        }

        .theme-dark .dark-card-green {
            background: linear-gradient(135deg, #1a3a2a, #2a4a3a) !important;
        }

        .theme-dark .dark-card-purple {
            background: linear-gradient(135deg, #2a1a3a, #3a2a4a) !important;
        }
    </style>
</head>
<body class="theme-pastel">
    <!-- Header -->
    <header class="sticky top-0 z-40 glass-effect shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex justify-between items-center mb-4">
                <div class="floating">
                    <h1 class="text-4xl font-bold">
                        ✨ <span class="gradient-text">แกลเลอรี</span>
                        <span class="gradient-text">กิจกรรม</span> ✨
                    </h1>
                    <p class="text-sm mt-1 font-medium" id="headerSubtitle">💕 ชมรูปสวยๆ จากกิจกรรมที่สนุกสุดๆ 📸</p>
                </div>
                
                <!-- Desktop Menu -->
                <nav class="hidden-mobile flex gap-2">
                    <button onclick="setCurrentPage('gallery')" class="nav-link active" id="btnGallery">
                        🖼️ แกลเลอรี
                    </button>
                    <button id="btnAdmin" onclick="setCurrentPage('admin')" class="nav-link hidden">
                        ⚙️ จัดการ
                    </button>
                    <button onclick="toggleAdmin()" class="nav-link">
                        🔐 Admin
                    </button>
                    <button onclick="toggleTheme()" class="theme-toggle">
                        🌓 <span id="themeText">Dark</span>
                    </button>
                </nav>

                <!-- Mobile Menu Button -->
                <button onclick="toggleMobileMenu()" class="hidden-desktop text-3xl">☰</button>
            </div>

            <!-- Mobile Menu -->
            <div id="mobileMenu" class="hidden-desktop glass-effect px-4 py-3 rounded-lg hidden space-y-2">
                <button onclick="setCurrentPage('gallery'); toggleMobileMenu()" class="w-full text-left nav-link active">
                    🖼️ แกลเลอรี
                </button>
                <button id="btnMobileAdmin" onclick="setCurrentPage('admin'); toggleMobileMenu()" class="w-full text-left nav-link hidden">
                    ⚙️ จัดการ
                </button>
                <button onclick="toggleAdmin()" class="w-full text-left nav-link">
                    🔐 Admin
                </button>
                <button onclick="toggleTheme()" class="w-full text-left theme-toggle">
                    🌓 <span id="themeMobileText">Dark</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12 main-content">
        <div id="galleryContent"></div>
        <div id="adminContent" class="hidden"></div>
    </main>

    <!-- Image Modal -->
    <div id="imageModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden modal-overlay backdrop-blur-sm" onclick="closeModal(event)">
        <div class="modal-content rounded-3xl max-w-2xl w-full max-h-[80vh] overflow-auto glass-effect" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="fixed top-4 right-4 rounded-full w-12 h-12 flex items-center justify-center text-2xl transition z-10" style="background: rgba(255,255,255,0.3);">✕</button>
            <img id="modalImage" src="" alt="" class="w-full h-auto rounded-2xl p-4">
            <div class="flex gap-3 p-4">
                <button onclick="downloadImage()" class="flex-1 btn-primary">
                    ⬇️ บันทึก
                </button>
                <button onclick="closeModal()" class="flex-1 py-3 rounded-lg transition font-medium" style="background: rgba(100,100,100,0.3); color: inherit;">
                    ปิด
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="hidden-desktop sticky-footer border-t">
        <div class="flex justify-around max-w-6xl mx-auto">
            <button onclick="setCurrentPage('gallery'); closeMobileMenu()" class="flex-1 py-4 flex flex-col items-center gap-1 border-t-4" id="navGallery">
                <span style="font-size: 24px;">🖼️</span>
                <span class="text-xs font-semibold">แกลเลอรี</span>
            </button>
            
            <button id="navAdmin" onclick="setCurrentPage('admin'); closeMobileMenu()" class="flex-1 py-4 flex flex-col items-center gap-1 hidden">
                <span style="font-size: 24px;">⚙️</span>
                <span class="text-xs font-semibold">จัดการ</span>
            </button>
            
            <button onclick="toggleAdmin()" class="flex-1 py-4 flex flex-col items-center gap-1">
                <span style="font-size: 24px;" id="adminIcon">🔐</span>
                <span class="text-xs font-semibold" id="adminText">Admin</span>
            </button>
        </div>
    </nav>

    <script>
        let currentPage = 'gallery';
        let isAdmin = false;
        let imageSize = 300;
        let selectedImage = null;
        let selectedFolder = null;
        let selectedFiles = [];
        let currentTheme = localStorage.getItem('theme') || 'pastel';

        const activities = [
            {
                id: 1,
                title: '🌸 กิจกรรมวันสดใส',
                description: 'วันสดใสเต็มไปด้วยความสุข รอยยิ้ม และเรื่องราวสนุกๆ ที่จะติดใจตลอดไป',
                emoji: '☀️',
                images: [
                    { id: '1', name: 'photo1.jpg', url: 'https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=800' },
                    { id: '2', name: 'photo2.jpg', url: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800' },
                    { id: '3', name: 'photo3.jpg', url: 'https://images.unsplash.com/photo-1517457373614-b7152f800fd1?w=800' },
                    { id: '4', name: 'photo4.jpg', url: 'https://images.unsplash.com/photo-1504609773096-104ff2176d46?w=800' }
                ]
            },
            {
                id: 2,
                title: '🎨 กิจกรรมสร้างสรรค์',
                description: 'ปล่อยจินตนาการ สร้างสรรค์งานศิลป์ สนุกไปกับการเรียนรู้และค้นพบความพิเศษของตัวเอง',
                emoji: '🎭',
                images: [
                    { id: '5', name: 'photo5.jpg', url: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=800' },
                    { id: '6', name: 'photo6.jpg', url: 'https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=800' },
                    { id: '7', name: 'photo7.jpg', url: 'https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=800' }
                ]
            },
            {
                id: 3,
                title: '💙 กิจกรรมแข่งขัน',
                description: 'ทีมเข้มแข็ง สไตล์เสมอ และจิตสำนึกในการทำงานร่วมกัน มีวิชาการ มีสุนทรีย์',
                emoji: '⚡',
                images: [
                    { id: '8', name: 'photo8.jpg', url: 'https://images.unsplash.com/photo-1552674605-5defe6aa44bb?w=800' },
                    { id: '9', name: 'photo9.jpg', url: 'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=800' }
                ]
            }
        ];

        window.onload = () => {
            initTheme();
            renderGallery();
        };

        function initTheme() {
            document.body.className = 'theme-' + currentTheme;
            const themeText = currentTheme === 'pastel' ? 'Dark' : 'Pastel';
            document.getElementById('themeText').textContent = themeText;
            document.getElementById('themeMobileText').textContent = themeText;
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'pastel' ? 'dark' : 'pastel';
            localStorage.setItem('theme', currentTheme);
            initTheme();
        }

        function renderGallery() {
            let html = '';
            const colorClasses = ['pastel-pink', 'pastel-purple', 'pastel-blue'];
            const darkColorClasses = ['dark-card-pink', 'dark-card-yellow', 'dark-card-green'];
            
            activities.forEach((activity, idx) => {
                const colorClass = currentTheme === 'pastel' ? colorClasses[idx] : darkColorClasses[idx];
                html += `
                    <div class="mb-16">
                        <div class="card ${colorClass}">
                            <div class="flex items-center gap-4">
                                <span class="text-6xl">${activity.emoji}</span>
                                <div>
                                    <h2 class="activity-title">${activity.title}</h2>
                                    <p class="text-lg">${activity.description}</p>
                                </div>
                            </div>
                        </div>
                        <div class="image-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(${imageSize}px, 1fr)); gap: 20px; margin-top: 20px;">
                `;
                activity.images.forEach(img => {
                    html += `
                        <div class="image-card" onclick="openModal('${img.url}', '${img.name}')">
                            <img src="${img.url}" alt="${img.name}">
                            <div class="image-overlay">
                                <span class="text-white text-lg font-bold">🔍 ขยาย</span>
                            </div>
                        </div>
                    `;
                });
                html += `
                        </div>
                    </div>
                `;
            });
            document.getElementById('galleryContent').innerHTML = html;
        }

        function renderAdmin() {
            const cardColorClass = currentTheme === 'pastel' 
                ? 'pastel-pink pastel-blue pastel-yellow pastel-green pastel-purple'
                : 'dark-card-pink dark-card-blue dark-card-yellow dark-card-green dark-card-purple';

            const html = `
                <div class="space-y-8">
                    <!-- เลือกโฟลเดอร์ -->
                    <div class="card" style="background: ${currentTheme === 'pastel' ? 'linear-gradient(135deg, #fce7f3, #fbcfe8)' : 'linear-gradient(135deg, #2a1a24, #3a2a34)'};">
                        <div class="flex items-center gap-3 mb-6">
                            <span class="text-4xl">📁</span>
                            <h2 class="text-3xl font-bold gradient-text">เลือกโฟลเดอร์อัพโหลด</h2>
                        </div>
                        <select id="folderSelect" onchange="onFolderSelected()" class="w-full px-4 py-3 border-2 rounded-xl focus:outline-none text-lg" style="background: ${currentTheme === 'pastel' ? '#fff' : '#1a1a1a'}; color: ${currentTheme === 'pastel' ? '#000' : '#e8e8e8'}; border-color: ${currentTheme === 'pastel' ? '#fbbf24' : '#ff1b35'};">
                            <option value="">-- เลือกโฟลเดอร์ --</option>
                            <option value='{"name":"กิจกรรมวันสดใส","id":"folder1"}'>📁 กิจกรรมวันสดใส</option>
                            <option value='{"name":"กิจกรรมสร้างสรรค์","id":"folder2"}'>📁 กิจกรรมสร้างสรรค์</option>
                            <option value='{"name":"กิจกรรมแข่งขัน","id":"folder3"}'>📁 กิจกรรมแข่งขัน</option>
                        </select>
                        <div id="selectedFolderInfo" class="hidden mt-4 p-4 rounded-xl" style="background: ${currentTheme === 'pastel' ? 'linear-gradient(135deg, #dbeafe, #bae6fd)' : 'linear-gradient(135deg, #1a2a3a, #2a3a4a)'};">
                            <p class="font-semibold">✓ โฟลเดอร์: <span id="folderNameDisplay" class="font-bold" style="color: ${currentTheme === 'pastel' ? '#ec4899' : '#ff1b35'};"></span></p>
                        </div>
                    </div>

                    <!-- อัพโหลดรูป -->
                    <div class="card" style="background: ${currentTheme === 'pastel' ? 'linear-gradient(135deg, #fef3c7, #fde68a)' : 'linear-gradient(135deg, #3a3a1a, #4a4a2a)'};">
                        <div class="flex items-center gap-3 mb-6">
                            <span class="text-4xl">📸</span>
                            <h2 class="text-3xl font-bold gradient-text">อัพโหลดรูปภาพ</h2>
                        </div>
                        <div id="uploadSection" class="hidden space-y-4">
                            <div class="border-4 border-dashed rounded-2xl p-12 text-center transition cursor-pointer" style="border-color: ${currentTheme === 'pastel' ? '#fbbf24' : '#ff4757'}; background-color: ${currentTheme === 'pastel' ? '#fffbeb' : '#2a2a1a'};"
                                 onclick="document.getElementById('imageInput').click()"
                                 ondrop="handleDrop(event)" ondragover="handleDragOver(event)">
                                <p class="text-6xl mb-3">📤</p>
                                <p class="text-2xl font-bold mb-2">ลากรูปมาที่นี่</p>
                                <p>หรือคลิกเพื่อเลือก</p>
                                <input type="file" id="imageInput" multiple accept="image/*" onchange="handleFileSelect(event)" style="display: none;">
                            </div>

                            <div id="selectedImages" class="hidden">
                                <p class="font-bold mb-3">📋 รูปที่เลือก: <span id="imageCount" style="color: ${currentTheme === 'pastel' ? '#ec4899' : '#ff1b35'};">0</span> รูป</p>
                                <div id="imagePreview" class="grid grid-cols-2 md:grid-cols-4 gap-4 max-h-80 overflow-y-auto"></div>
                                <div class="flex gap-2 mt-4">
                                    <button onclick="uploadImages()" class="flex-1 btn-primary text-lg py-4">
                                        ✅ อัพโหลด
                                    </button>
                                    <button onclick="clearImages()" class="flex-1 py-4 rounded-xl transition font-bold" style="background: ${currentTheme === 'pastel' ? '#fbbf24' : '#555'};">
                                        ✕ ยกเลิก
                                    </button>
                                </div>
                            </div>
                            <div id="uploadStatus" class="hidden p-4 rounded-xl text-center font-bold"></div>
                        </div>

                        <div id="noFolderMessage" class="p-6 rounded-xl text-center" style="background: ${currentTheme === 'pastel' ? 'linear-gradient(135deg, #fed7aa, #fdba74)' : 'linear-gradient(135deg, #4a3a2a, #6a5a4a)'};">
                            <p class="text-xl font-bold">⚠️ กรุณาเลือกโฟลเดอร์ก่อนอัพโหลดรูป</p>
                        </div>
                    </div>

                    <!-- ปรับขนาดรูป -->
                    <div class="card" style="background: ${currentTheme === 'pastel' ? 'linear-gradient(135deg, #dcfce7, #bbf7d0)' : 'linear-gradient(135deg, #1a3a2a, #2a4a3a)'};">
                        <div class="flex items-center gap-3 mb-6">
                            <span class="text-4xl">⚙️</span>
                            <h2 class="text-3xl font-bold gradient-text">จัดการขนาดรูป</h2>
                        </div>
                        <label class="block text-lg font-bold mb-4">
                            ขนาดรูป: <span id="sizeDisplay" class="gradient-text text-2xl">300</span>px
                        </label>
                        <input type="range" min="150" max="500" value="300" onchange="changeImageSize(this.value)" class="w-full h-4 rounded-lg" style="background: ${currentTheme === 'pastel' ? 'linear-gradient(to right, #86efac, #60a5fa)' : 'linear-gradient(to right, #ff4757, #ffa502)'};;">
                    </div>

                    <!-- ลิ้งค์จัดการข้อมูล -->
                    <div class="card" style="background: ${currentTheme === 'pastel' ? 'linear-gradient(135deg, #f3e8ff, #e9d5ff)' : 'linear-gradient(135deg, #2a1a3a, #3a2a4a)'};">
                        <div class="flex items-center gap-3 mb-6">
                            <span class="text-4xl">🔗</span>
                            <h2 class="text-3xl font-bold gradient-text">ลิ้งค์จัดการข้อมูล</h2>
                        </div>
                        <div class="space-y-3">
                            <a href="https://docs.google.com/spreadsheets/d/1awRAkSlzYyu2aBnr4cof0JX7fxNoDcoGOeOlfIoSTbU/" target="_blank" class="block p-4 rounded-xl transition transform hover:scale-105" style="background: ${currentTheme === 'pastel' ? 'linear-gradient(135deg, #dbeafe, #bae6fd)' : 'linear-gradient(135deg, #1a2a3a, #2a3a4a)'};">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="font-bold text-lg">📊 Google Sheets</p>
                                        <p class="text-sm">จัดการข้อมูลกิจกรรม & Folder ID</p>
                                    </div>
                                    <span class="text-3xl">→</span>
                                </div>
                            </a>

                            <a href="https://drive.google.com/drive/folders/1Ymln5xGCN2GjplQujJIcmHbOwFLAlMaI" target="_blank" class="block p-4 rounded-xl transition transform hover:scale-105" style="background: ${currentTheme === 'pastel' ? 'linear-gradient(135deg, #dcfce7, #bbf7d0)' : 'linear-gradient(135deg, #1a3a2a, #2a4a3a)'};">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="font-bold text-lg">📁 Google Drive</p>
                                        <p class="text-sm">อัพโหลดรูป & จัดการโฟลเดอร์</p>
                                    </div>
                                    <span class="text-3xl">→</span>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('adminContent').innerHTML = html;
        }

        function setCurrentPage(page) {
            currentPage = page;
            document.getElementById('galleryContent').classList.toggle('hidden', page !== 'gallery');
            document.getElementById('adminContent').classList.toggle('hidden', page !== 'admin');
            
            if (page === 'gallery') {
                renderGallery();
            } else {
                renderAdmin();
            }
        }

        function onFolderSelected() {
            const select = document.getElementById('folderSelect');
            if (!select.value) {
                selectedFolder = null;
                document.getElementById('selectedFolderInfo').classList.add('hidden');
                document.getElementById('uploadSection').classList.add('hidden');
                document.getElementById('noFolderMessage').classList.remove('hidden');
                return;
            }
            selectedFolder = JSON.parse(select.value);
            document.getElementById('folderNameDisplay').textContent = selectedFolder.name;
            document.getElementById('selectedFolderInfo').classList.remove('hidden');
            document.getElementById('uploadSection').classList.remove('hidden');
            document.getElementById('noFolderMessage').classList.add('hidden');
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDrop(e) {
            e.preventDefault();
            handleFileSelect({ target: { files: e.dataTransfer.files } });
        }

        function handleFileSelect(e) {
            selectedFiles = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
            if (selectedFiles.length === 0) {
                alert('⚠️ กรุณาเลือกรูปเท่านั้น');
                return;
            }
            showSelectedImages();
        }

        function showSelectedImages() {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'relative group';
                    div.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-24 object-cover rounded-lg border-2" style="border-color: ${currentTheme === 'pastel' ? '#ec4899' : '#ff1b35'};">
                        <button onclick="removeImage(${index})" class="absolute top-1 right-1 text-white rounded-full w-6 h-6 opacity-0 group-hover:opacity-100 text-sm font-bold" style="background: #ff4444;">✕</button>
                    `;
                    preview.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
            document.getElementById('imageCount').textContent = selectedFiles.length;
            document.getElementById('selectedImages').classList.remove('hidden');
        }

        function removeImage(index) {
            selectedFiles.splice(index, 1);
            if (selectedFiles.length === 0) {
                document.getElementById('selectedImages').classList.add('hidden');
            } else {
                showSelectedImages();
            }
        }

        function clearImages() {
            selectedFiles = [];
            document.getElementById('imageInput').value = '';
            document.getElementById('selectedImages').classList.add('hidden');
        }

        function uploadImages() {
            if (!selectedFolder || selectedFiles.length === 0) {
                alert('⚠️ กรุณาเลือกโฟลเดอร์และรูป');
                return;
            }
            const status = document.getElementById('uploadStatus');
            status.className = 'p-4 rounded-xl text-center font-bold';
            status.innerHTML = '⏳ กำลังอัพโหลด ' + selectedFiles.length + ' รูป...';
            status.classList.remove('hidden');
            setTimeout(() => {
                status.innerHTML = `✅ อัพโหลดสำเร็จ! (${selectedFiles.length} รูป)`;
                clearImages();
            }, 1500);
        }

        function openModal(imageUrl, imageName) {
            selectedImage = { url: imageUrl, name: imageName };
            document.getElementById('modalImage').src = imageUrl;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('imageModal')) return;
            document.getElementById('imageModal').classList.add('hidden');
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.href = selectedImage.url;
            link.download = selectedImage.name;
            link.click();
        }

        function toggleAdmin() {
            if (!isAdmin) {
                const password = prompt('🔐 ใส่รหัส Admin:');
                if (password === '434143') {
                    isAdmin = true;
                    document.getElementById('btnAdmin').classList.remove('hidden');
                    document.getElementById('btnMobileAdmin').classList.remove('hidden');
                    document.getElementById('navAdmin').classList.remove('hidden');
                    document.getElementById('adminIcon').textContent = '👤';
                    document.getElementById('adminText').textContent = 'ออก';
                    setCurrentPage('admin');
                } else if (password !== null) {
                    alert('❌ รหัสไม่ถูกต้อง!');
                }
            } else {
                isAdmin = false;
                document.getElementById('btnAdmin').classList.add('hidden');
                document.getElementById('btnMobileAdmin').classList.add('hidden');
                document.getElementById('navAdmin').classList.add('hidden');
                document.getElementById('adminIcon').textContent = '🔐';
                document.getElementById('adminText').textContent = 'Admin';
                setCurrentPage('gallery');
            }
        }

        function changeImageSize(size) {
            imageSize = parseInt(size);
            document.getElementById('sizeDisplay').textContent = imageSize;
            renderGallery();
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        }

        function closeMobileMenu() {
            document.getElementById('mobileMenu').classList.add('hidden');
        }
    </script>
</body>
</html>
