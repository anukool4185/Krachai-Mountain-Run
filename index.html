<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 แกลเลอรีกิจกรรม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 40;
        }
        .main-content {
            padding-bottom: 80px;
        }
        @media (min-width: 768px) {
            .main-content {
                padding-bottom: 32px;
            }
        }
        .image-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 32px;
        }
        .image-card {
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
        }
        .image-card:hover {
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
            transform: scale(1.05);
        }
        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .image-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0);
            display: flex;
            align-items: center;
            justify-center;
            transition: background 0.3s ease;
            color: white;
            opacity: 0;
        }
        .image-card:hover .image-overlay {
            background: rgba(0,0,0,0.4);
            opacity: 1;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-center;
            z-index: 50;
            padding: 16px;
        }
        .modal-content {
            background: white;
            border-radius: 8px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            position: relative;
        }
        .modal-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
        .hidden {
            display: none !important;
        }
        .spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @media (max-width: 767px) {
            .hidden-mobile {
                display: none !important;
            }
        }
        @media (min-width: 768px) {
            .hidden-desktop {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-50 to-white">
    <div id="app">
        <!-- Loading Screen -->
        <div id="loading" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
            <div class="text-center">
                <div class="inline-block p-4 mb-4">
                    <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full spin"></div>
                </div>
                <p class="text-gray-600">กำลังโหลดข้อมูล...</p>
            </div>
        </div>

        <!-- Header -->
        <header class="sticky top-0 z-40 bg-white shadow-md">
            <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-blue-600">📸 แกลเลอรีกิจกรรม</h1>
                    <p class="text-sm text-gray-600">ชมรูปภาพและเรื่องราวจากกิจกรรมต่างๆ</p>
                </div>
                
                <!-- Desktop Menu -->
                <nav class="hidden-mobile flex gap-4">
                    <button onclick="setCurrentPage('gallery')" id="btnGallery" class="px-4 py-2 rounded-lg font-medium transition bg-blue-600 text-white">
                        🖼️ แกลเลอรี
                    </button>
                    <button id="btnAdmin" onclick="setCurrentPage('admin')" class="px-4 py-2 rounded-lg font-medium transition bg-gray-200 text-gray-800 hover:bg-gray-300 hidden">
                        ⚙️ จัดการ
                    </button>
                    <button onclick="toggleAdmin()" class="px-4 py-2 rounded-lg font-medium bg-yellow-200 text-yellow-800 hover:bg-yellow-300 transition">
                        🔐 Admin
                    </button>
                </nav>

                <!-- Mobile Menu Button -->
                <button onclick="toggleMobileMenu()" class="hidden-desktop p-2 hover:bg-gray-200 rounded-lg">
                    <span class="text-2xl">☰</span>
                </button>
            </div>

            <!-- Mobile Menu -->
            <div id="mobileMenu" class="hidden-desktop bg-white border-t border-gray-200 px-4 py-3 flex flex-col gap-2 hidden">
                <button onclick="setCurrentPage('gallery'); toggleMobileMenu()" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100">
                    🖼️ แกลเลอรี
                </button>
                <button id="btnMobileAdmin" onclick="setCurrentPage('admin'); toggleMobileMenu()" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 hidden">
                    ⚙️ จัดการ
                </button>
                <button onclick="toggleAdmin()" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 font-medium text-yellow-600">
                    🔐 Admin
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-8 main-content">
            <div id="galleryContent"></div>
            <div id="adminContent" class="hidden"></div>
        </main>

        <!-- Image Popup -->
        <div id="imageModal" class="modal-overlay hidden" onclick="closeModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <button onclick="closeModal()" style="position: absolute; top: 12px; right: 12px; z-index: 10; background: white; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; border: none; display: flex; align-items: center; justify-center;">✕</button>
                <img id="modalImage" src="" alt="" class="modal-image p-4">
                <div class="flex gap-3 p-4">
                    <button onclick="downloadImage()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium">
                        ⬇️ บันทึกรูป
                    </button>
                    <button onclick="closeModal()" class="flex-1 bg-gray-300 text-gray-800 py-2 rounded-lg hover:bg-gray-400 transition font-medium">
                        ปิด
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Bottom Navigation -->
        <nav class="hidden-desktop sticky-footer bg-white border-t border-gray-200 shadow-2xl">
            <div class="flex justify-around max-w-6xl mx-auto">
                <button onclick="setCurrentPage('gallery'); closeMobileMenu()" class="flex-1 py-3 flex flex-col items-center gap-1 transition text-blue-600 bg-blue-50 border-b-2 border-blue-600" id="navGallery">
                    <span style="font-size: 24px;">🖼️</span>
                    <span class="text-xs">แกลเลอรี</span>
                </button>
                
                <button id="navAdmin" onclick="setCurrentPage('admin'); closeMobileMenu()" class="flex-1 py-3 flex flex-col items-center gap-1 transition text-gray-600 hover:text-purple-600 hidden">
                    <span style="font-size: 24px;">⚙️</span>
                    <span class="text-xs">จัดการ</span>
                </button>
                
                <button onclick="toggleAdmin()" class="flex-1 py-3 flex flex-col items-center gap-1 transition text-gray-600 hover:text-yellow-600">
                    <span id="adminIcon" style="font-size: 24px;">🔐</span>
                    <span id="adminText" class="text-xs">Admin</span>
                </button>
            </div>
        </nav>
    </div>

    <script>
        let currentPage = 'gallery';
        let isAdmin = false;
        let imageSize = 300;
        let activities = [];
        let selectedImage = null;
        let selectedFolder = null;
        let selectedFiles = [];

        // Sample Data
        const sampleActivities = [
            {
                id: 1,
                title: '🎉 กิจกรรมวันสดใส',
                description: 'กิจกรรมสนุกสำหรับวัยหนุ่มสาว',
                images: [
                    { id: '1', name: 'photo1.jpg', url: 'https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=800' },
                    { id: '2', name: 'photo2.jpg', url: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800' },
                    { id: '3', name: 'photo3.jpg', url: 'https://images.unsplash.com/photo-1517457373614-b7152f800fd1?w=800' }
                ]
            },
            {
                id: 2,
                title: '🎨 กิจกรรมสร้างสรรค์',
                description: 'พัฒนาทักษะและความสามารถ',
                images: [
                    { id: '4', name: 'photo4.jpg', url: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=800' },
                    { id: '5', name: 'photo5.jpg', url: 'https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=800' }
                ]
            }
        ];

        // Initialize
        window.onload = function() {
            activities = sampleActivities;
            renderGallery();
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 500);
        };

        function setCurrentPage(page) {
            currentPage = page;
            document.getElementById('galleryContent').classList.toggle('hidden', page !== 'gallery');
            document.getElementById('adminContent').classList.toggle('hidden', page !== 'admin');
            
            if (page === 'gallery') {
                renderGallery();
            } else {
                renderAdmin();
            }
        }

        function renderGallery() {
            let html = '';
            activities.forEach(activity => {
                html += `
                    <div class="mb-12">
                        <div class="mb-6">
                            <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">${activity.title}</h2>
                            <p class="text-gray-600">${activity.description}</p>
                        </div>
                        <div class="image-grid" style="grid-template-columns: repeat(auto-fill, minmax(${imageSize}px, 1fr));">
                `;
                
                activity.images.forEach(img => {
                    html += `
                        <div class="image-card" onclick="openModal('${img.url}', '${img.name}')">
                            <img src="${img.url}" alt="${img.name}">
                            <div class="image-overlay">
                                <span class="text-sm font-medium">กดเพื่อขยาย</span>
                            </div>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('galleryContent').innerHTML = html;
        }

        function renderAdmin() {
            const html = `
                <div class="space-y-8">
                    <!-- เลือกโฟลเดอร์ -->
                    <div class="bg-white rounded-lg shadow-lg p-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">📁 เลือกโฟลเดอร์อัพโหลด</h2>
                        <select id="folderSelect" onchange="onFolderSelected()" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
                            <option value="">-- เลือกโฟลเดอร์ --</option>
                            <option value='{"name":"กิจกรรมวันสดใส","id":"folder1"}'>📁 กิจกรรมวันสดใส</option>
                            <option value='{"name":"กิจกรรมสร้างสรรค์","id":"folder2"}'>📁 กิจกรรมสร้างสรรค์</option>
                        </select>
                        <div id="selectedFolderInfo" class="hidden mt-4 p-4 bg-blue-50 rounded-lg">
                            <p><strong>📁 โฟลเดอร์:</strong> <span id="folderNameDisplay"></span></p>
                            <p class="text-sm text-gray-600 mt-2">เลือกแล้ว ✓</p>
                        </div>
                    </div>

                    <!-- อัพโหลดรูป -->
                    <div class="bg-white rounded-lg shadow-lg p-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">📸 อัพโหลดรูปภาพ</h2>
                        <div id="uploadSection" class="hidden space-y-4">
                            <div class="border-2 border-dashed border-blue-300 rounded-lg p-8 text-center hover:border-blue-500 transition cursor-pointer"
                                 onclick="document.getElementById('imageInput').click()"
                                 ondrop="handleDrop(event)" ondragover="handleDragOver(event)">
                                <p class="text-4xl mb-2">📤</p>
                                <p class="text-lg font-medium text-gray-700 mb-2">ลากรูปมาที่นี่</p>
                                <p class="text-sm text-gray-500">หรือคลิกเลือก</p>
                                <input type="file" id="imageInput" multiple accept="image/*" onchange="handleFileSelect(event)" style="display: none;">
                            </div>

                            <div id="selectedImages" class="hidden">
                                <h3 class="font-medium text-gray-800 mb-3">📋 รูปที่เลือก: <span id="imageCount">0</span> รูป</h3>
                                <div id="imagePreview" class="grid grid-cols-2 md:grid-cols-3 gap-4 max-h-64 overflow-y-auto"></div>
                                <div class="flex gap-2 mt-4">
                                    <button onclick="uploadImages()" class="flex-1 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-medium">
                                        ✅ อัพโหลด
                                    </button>
                                    <button onclick="clearImages()" class="flex-1 bg-gray-400 text-white py-2 rounded-lg hover:bg-gray-500">
                                        ✕ ยกเลิก
                                    </button>
                                </div>
                            </div>

                            <div id="uploadStatus" class="hidden p-4 rounded-lg"></div>
                        </div>

                        <div id="noFolderMessage" class="p-4 bg-yellow-50 text-yellow-800 rounded-lg">
                            ⚠️ กรุณาเลือกโฟลเดอร์ก่อนอัพโหลดรูป
                        </div>
                    </div>

                    <!-- ลิ้งค์จัดการข้อมูล -->
                    <div class="bg-white rounded-lg shadow-lg p-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">🔗 จัดการข้อมูล</h2>
                        <div class="space-y-3">
                            <a href="https://docs.google.com/spreadsheets/d/1awRAkSlzYyu2aBnr4cof0JX7fxNoDcoGOeOlfIoSTbU/" target="_blank" class="flex items-center gap-3 p-4 bg-blue-50 hover:bg-blue-100 rounded-lg transition">
                                <span class="text-3xl">📊</span>
                                <div>
                                    <p class="font-medium text-gray-800">Google Sheets</p>
                                    <p class="text-sm text-gray-600">จัดการชื่อโฟลเดอร์ และ Folder ID</p>
                                </div>
                                <span class="ml-auto text-blue-600">→</span>
                            </a>

                            <a href="https://drive.google.com/drive/folders/1Ymln5xGCN2GjplQujJIcmHbOwFLAlMaI" target="_blank" class="flex items-center gap-3 p-4 bg-green-50 hover:bg-green-100 rounded-lg transition">
                                <span class="text-3xl">📁</span>
                                <div>
                                    <p class="font-medium text-gray-800">Google Drive</p>
                                    <p class="text-sm text-gray-600">จัดการรูป และ โฟลเดอร์</p>
                                </div>
                                <span class="ml-auto text-green-600">→</span>
                            </a>
                        </div>
                    </div>

                    <!-- ปรับขนาดรูป -->
                    <div class="bg-white rounded-lg shadow-lg p-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">⚙️ จัดการขนาดรูป</h2>
                        <label class="block text-lg font-medium text-gray-700 mb-3">
                            ขนาดรูป: <span id="sizeDisplay">300</span>px
                        </label>
                        <input type="range" min="150" max="500" value="300" 
                               onchange="changeImageSize(this.value)" 
                               class="w-full h-3 bg-gray-200 rounded-lg accent-blue-600">
                    </div>
                </div>
            `;
            document.getElementById('adminContent').innerHTML = html;
        }

        function onFolderSelected() {
            const select = document.getElementById('folderSelect');
            if (!select.value) {
                selectedFolder = null;
                document.getElementById('selectedFolderInfo').classList.add('hidden');
                document.getElementById('uploadSection').classList.add('hidden');
                document.getElementById('noFolderMessage').classList.remove('hidden');
                return;
            }

            selectedFolder = JSON.parse(select.value);
            document.getElementById('folderNameDisplay').textContent = selectedFolder.name;
            document.getElementById('selectedFolderInfo').classList.remove('hidden');
            document.getElementById('uploadSection').classList.remove('hidden');
            document.getElementById('noFolderMessage').classList.add('hidden');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.style.borderColor = '#3b82f6';
            e.currentTarget.style.backgroundColor = '#eff6ff';
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.style.borderColor = '#bfdbfe';
            const files = e.dataTransfer.files;
            handleFileSelect({ target: { files } });
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            selectedFiles = files.filter(f => f.type.startsWith('image/'));
            
            if (selectedFiles.length === 0) {
                alert('⚠️ กรุณาเลือกรูปเท่านั้น');
                return;
            }

            showSelectedImages();
        }

        function showSelectedImages() {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'relative group';
                    div.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-32 object-cover rounded" alt="">
                        <button onclick="removeImage(${index})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-6 h-6 opacity-0 group-hover:opacity-100 text-sm">✕</button>
                    `;
                    preview.appendChild(div);
                };
                reader.readAsDataURL(file);
            });

            document.getElementById('imageCount').textContent = selectedFiles.length;
            document.getElementById('selectedImages').classList.remove('hidden');
        }

        function removeImage(index) {
            selectedFiles.splice(index, 1);
            if (selectedFiles.length === 0) {
                document.getElementById('selectedImages').classList.add('hidden');
            } else {
                showSelectedImages();
            }
        }

        function clearImages() {
            selectedFiles = [];
            document.getElementById('imageInput').value = '';
            document.getElementById('selectedImages').classList.add('hidden');
        }

        function uploadImages() {
            if (!selectedFolder || selectedFiles.length === 0) {
                alert('⚠️ กรุณาเลือกโฟลเดอร์และรูป');
                return;
            }

            const status = document.getElementById('uploadStatus');
            status.className = 'p-4 rounded-lg bg-blue-100 text-blue-800';
            status.innerHTML = '⏳ กำลังอัพโหลด ' + selectedFiles.length + ' รูป...';
            status.classList.remove('hidden');

            setTimeout(() => {
                status.className = 'p-4 rounded-lg bg-green-100 text-green-800';
                status.innerHTML = `✅ อัพโหลดสำเร็จ! (${selectedFiles.length} รูป)`;
                clearImages();
            }, 1500);
        }

        function openModal(imageUrl, imageName) {
            selectedImage = { url: imageUrl, name: imageName };
            document.getElementById('modalImage').src = imageUrl;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('imageModal')) return;
            document.getElementById('imageModal').classList.add('hidden');
        }

        function downloadImage() {
            if (!selectedImage) return;
            const link = document.createElement('a');
            link.href = selectedImage.url;
            link.download = selectedImage.name;
            link.click();
        }

        function toggleAdmin() {
            if (!isAdmin) {
                const password = prompt('📌 ใส่รหัสแอดมิน:');
                if (password === '434143') {
                    isAdmin = true;
                    activateAdminMode();
                } else if (password !== null) {
                    alert('❌ รหัสไม่ถูกต้อง!');
                }
            } else {
                isAdmin = false;
                deactivateAdminMode();
            }
        }

        function activateAdminMode() {
            document.getElementById('btnAdmin').classList.remove('hidden');
            document.getElementById('btnMobileAdmin').classList.remove('hidden');
            document.getElementById('navAdmin').classList.remove('hidden');
            document.getElementById('adminIcon').textContent = '👤';
            document.getElementById('adminText').textContent = 'ออกแอดมิน';
            setCurrentPage('admin');
        }

        function deactivateAdminMode() {
            document.getElementById('btnAdmin').classList.add('hidden');
            document.getElementById('btnMobileAdmin').classList.add('hidden');
            document.getElementById('navAdmin').classList.add('hidden');
            document.getElementById('adminIcon').textContent = '🔐';
            document.getElementById('adminText').textContent = 'Admin';
            setCurrentPage('gallery');
        }

        function changeImageSize(size) {
            imageSize = parseInt(size);
            document.getElementById('sizeDisplay').textContent = imageSize;
            renderGallery();
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        }

        function closeMobileMenu() {
            document.getElementById('mobileMenu').classList.add('hidden');
        }
    </script>
</body>
</html>
