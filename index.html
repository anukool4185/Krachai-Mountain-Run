<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ แกลเลอรีกิจกรรม ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }

        body.theme-pastel {
            background: linear-gradient(135deg, #fce7f3 0%, #dbeafe 25%, #fef3c7 50%, #dcfce7 75%, #f3e8ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            color: #333;
        }

        body.theme-dark {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #e8e8e8;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-effect {
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .theme-pastel .glass-effect {
            background: rgba(255, 255, 255, 0.7);
        }

        .theme-dark .glass-effect {
            background: rgba(20, 20, 20, 0.8);
            border-color: rgba(255, 27, 53, 0.3);
        }

        .gradient-text {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-dark .gradient-text {
            background: linear-gradient(135deg, #ff1b35, #ff6b9d, #ffd60a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card {
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .theme-pastel .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(254, 243, 199, 0.4));
        }

        .theme-dark .card {
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.9), rgba(35, 35, 35, 0.6));
        }

        .btn-primary {
            color: white;
            padding: 12px 24px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .theme-pastel .btn-primary {
            background: linear-gradient(135deg, #f472b6, #c084fc);
        }

        .theme-dark .btn-primary {
            background: linear-gradient(135deg, #ff1b35, #ff4757);
        }

        .btn-primary:hover { transform: translateY(-2px); }

        .image-card {
            cursor: pointer;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.6);
        }

        .image-card:hover {
            transform: translateY(-12px) scale(1.02);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-content { padding-bottom: 20px; }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="theme-pastel">
    <!-- Header -->
    <header class="sticky top-0 z-40 glass-effect shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <div class="floating">
                    <h1 class="text-4xl font-bold">✨ <span class="gradient-text">แกลเลอรีกิจกรรม</span> ✨</h1>
                    <p class="text-sm mt-1 font-medium">💕 ชมรูปสวยๆ จากกิจกรรม 📸 <span class="text-xs opacity-70">(v2.4 - เปิดใช้ได้เลย)</span></p>
                </div>
                
                <button onclick="toggleTheme()" class="btn-primary">🌓</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12 main-content">
        <div id="galleryView" class="space-y-8">
            <div class="card text-center">
                <div class="loading mx-auto mb-4"></div>
                <p class="text-xl">⏳ กำลังโหลดแกลเลอรี...</p>
            </div>
        </div>
    </main>

    <!-- Image Modal -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-2xl w-full relative">
            <button onclick="closeModal()" class="absolute top-2 right-2 text-3xl font-bold z-10">✕</button>
            <img id="modalImage" src="" alt="" class="w-full h-auto rounded-t-2xl">
            <div class="p-4 flex gap-2">
                <a id="downloadBtn" download class="flex-1 btn-primary text-center">⬇️ บันทึก</a>
                <button onclick="closeModal()" class="flex-1 bg-gray-300 text-gray-800 py-3 rounded-lg font-bold">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        // ⚙️ ตั้งค่า (ตรวจสอบว่า Share กับ "Anyone with link")
        const FOLDER_ID = '1Ymln5xGCN2GjplQujJIcmHbOwFLAlMaI';
        
        let currentTheme = localStorage.getItem('theme') || 'pastel';

        window.onload = async () => {
            initTheme();
            await loadGallery();
        };

        function initTheme() {
            document.body.className = 'theme-' + currentTheme;
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'pastel' ? 'dark' : 'pastel';
            localStorage.setItem('theme', currentTheme);
            initTheme();
        }

        async function loadGallery() {
            try {
                // ใช้ Google Drive V3 API (Public - ไม่ต้อง Auth)
                // Note: ต้องให้ Folder Share "Anyone with link can view"
                
                const proxyUrl = 'https://www.googleapis.com/drive/v3/files';
                
                // ดึง Subfolders (โฟลเดอร์ย่อย)
                const query = `'${FOLDER_ID}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
                
                // ใช้ Google Drive API โดยตรง (ไม่ต้อง API Key ถ้าเป็น Public)
                // หรือให้ใช้ fetch แบบ Simple ตรงโฟลเดอร์
                
                // วิธีอื่น: ใช้ CORS proxy
                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&access_token=`,
                    { method: 'GET' }
                ).catch(() => null);

                // ถ้า API ไม่ได้ ให้แสดงขั้นตอนการดาวน์โหลด
                if (!response || !response.ok) {
                    showManualGuide();
                    return;
                }

                const data = await response.json();
                
                if (data.error) {
                    showManualGuide();
                    return;
                }

                // ดึงรูปภาพจากแต่ละโฟลเดอร์
                const folders = data.files || [];
                let galleryData = [];

                for (const folder of folders) {
                    const imagesQuery = `'${folder.id}' in parents and mimeType contains 'image/' and trashed=false`;
                    const imagesResponse = await fetch(
                        `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(imagesQuery)}&fields=files(id,name)&access_token=`,
                        { method: 'GET' }
                    ).catch(() => null);

                    if (imagesResponse && imagesResponse.ok) {
                        const imagesData = await imagesResponse.json();
                        const images = imagesData.files || [];
                        
                        if (images.length > 0) {
                            galleryData.push({
                                name: folder.name,
                                images: images
                            });
                        }
                    }
                }

                if (galleryData.length > 0) {
                    renderGallery(galleryData);
                } else {
                    showManualGuide();
                }

            } catch (error) {
                console.error('Error:', error);
                showManualGuide();
            }
        }

        function renderGallery(folders) {
            let html = '';
            
            folders.forEach(folder => {
                html += `
                    <div class="mb-16">
                        <div class="card mb-8">
                            <h2 class="text-3xl font-bold gradient-text">📁 ${folder.name}</h2>
                            <p class="text-gray-600 mt-2">${folder.images.length} รูป</p>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                `;
                
                folder.images.forEach(img => {
                    const imageUrl = `https://drive.google.com/thumbnail?id=${img.id}&sz=w500`;
                    html += `
                        <div class="image-card" onclick="openModal('${imageUrl}', '${img.name}', '${img.id}')">
                            <img src="${imageUrl}" alt="${img.name}" onerror="this.src='https://via.placeholder.com/200?text=Loading'">
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            });

            document.getElementById('galleryView').innerHTML = html;
        }

        function showManualGuide() {
            document.getElementById('galleryView').innerHTML = `
                <div class="card text-center">
                    <h2 class="text-2xl font-bold gradient-text mb-4">📸 แกลเลอรีกิจกรรม</h2>
                    <p class="mb-4">⚠️ ต้องให้ Folder Share "Anyone with link" ก่อน</p>
                    
                    <div class="bg-yellow-100 rounded-lg p-6 text-left mb-6">
                        <p class="font-bold mb-3">📋 ขั้นตอน:</p>
                        <ol class="space-y-2 text-sm">
                            <li>1. เข้า Google Drive</li>
                            <li>2. คลิกขวา Folder → Share</li>
                            <li>3. ที่ "General access" → เลือก "Anyone with the link"</li>
                            <li>4. ตั้ง Role เป็น "Viewer"</li>
                            <li>5. Copy Link → ใช้</li>
                            <li>6. Refresh หน้านี้</li>
                        </ol>
                    </div>

                    <div class="bg-blue-100 rounded-lg p-4 text-left text-xs font-mono break-all">
                        <p class="font-bold mb-2">📍 Folder ปัจจุบัน:</p>
                        <p>ID: ${FOLDER_ID}</p>
                        <p class="mt-2">Link: https://drive.google.com/drive/folders/${FOLDER_ID}</p>
                    </div>
                </div>
            `;
        }

        function openModal(url, name, fileId) {
            // แสดงรูปจาก Drive
            const directUrl = `https://drive.google.com/uc?export=view&id=${fileId}`;
            document.getElementById('modalImage').src = directUrl;
            document.getElementById('downloadBtn').href = directUrl;
            document.getElementById('downloadBtn').download = name;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }
    </script>
</body>
</html>
