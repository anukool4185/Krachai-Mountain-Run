<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ แกลเลอรีกิจกรรม ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }

        body.theme-pastel {
            background: linear-gradient(135deg, #fce7f3 0%, #dbeafe 25%, #fef3c7 50%, #dcfce7 75%, #f3e8ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            color: #333;
        }

        body.theme-dark {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #e8e8e8;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-effect {
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .theme-pastel .glass-effect {
            background: rgba(255, 255, 255, 0.7);
        }

        .theme-dark .glass-effect {
            background: rgba(20, 20, 20, 0.8);
            border-color: rgba(255, 27, 53, 0.3);
        }

        .gradient-text {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .theme-dark .gradient-text {
            background: linear-gradient(135deg, #ff1b35, #ff6b9d, #ffd60a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card {
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .theme-pastel .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(254, 243, 199, 0.4));
        }

        .theme-dark .card {
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.9), rgba(35, 35, 35, 0.6));
        }

        .btn-primary {
            color: white;
            padding: 12px 24px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .theme-pastel .btn-primary {
            background: linear-gradient(135deg, #f472b6, #c084fc);
        }

        .theme-dark .btn-primary {
            background: linear-gradient(135deg, #ff1b35, #ff4757);
        }

        .btn-primary:hover { transform: translateY(-2px); }

        .image-card {
            cursor: pointer;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 3px solid rgba(255, 255, 255, 0.6);
        }

        .image-card:hover {
            transform: translateY(-12px) scale(1.02);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-content { padding-bottom: 20px; }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body class="theme-pastel">
    <!-- Header -->
    <header class="sticky top-0 z-40 glass-effect shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <div class="floating">
                    <h1 class="text-4xl font-bold">✨ <span class="gradient-text">แกลเลอรีกิจกรรม</span> ✨</h1>
                    <p class="text-sm mt-1 font-medium">💕 ชมรูปสวยๆ จากกิจกรรม 📸 <span class="text-xs opacity-70">(v2.3 - พร้อมใช้)</span></p>
                </div>
                
                <button onclick="toggleTheme()" class="btn-primary">🌓</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-12 main-content">
        <div id="galleryView" class="space-y-8">
            <div class="card text-center">
                <p class="text-xl">⏳ กำลังโหลดแกลเลอรี...</p>
            </div>
        </div>
    </main>

    <!-- Image Modal -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-2xl w-full">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-2xl">✕</button>
            <img id="modalImage" src="" alt="" class="w-full h-auto rounded-t-2xl">
            <div class="p-4 flex gap-2">
                <a id="downloadBtn" download class="flex-1 btn-primary text-center">⬇️ บันทึก</a>
                <button onclick="closeModal()" class="flex-1 bg-gray-300 text-gray-800 py-3 rounded-lg">ปิด</button>
            </div>
        </div>
    </div>

    <script>
        // ⚙️ ตั้งค่า (พร้อมแล้ว)
        const SHEET_ID = '1awRAkSlzYyu2aBnr4cof0JX7fxNoDcoGOeOlfIoSTbU';
        const FOLDER_ID = '1Ymln5xGCN2GjplQujJIcmHbOwFLAlMaI';
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxbGLgG6o0G4_aIm3lvMrNUj_0QLcif-dJkb4DGtO2h4F9KbvIFehf7jje_uKpvKTJiGQ/exec';
        
        let currentTheme = localStorage.getItem('theme') || 'pastel';

        window.onload = async () => {
            initTheme();
            await loadGallery();
        };

        function initTheme() {
            document.body.className = 'theme-' + currentTheme;
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'pastel' ? 'dark' : 'pastel';
            localStorage.setItem('theme', currentTheme);
            initTheme();
        }

        async function loadGallery() {
            try {
                // เรียก Web App URL เพื่อดึงข้อมูลรูป
                const response = await fetch(`${WEB_APP_URL}?action=getFolders&folderId=${FOLDER_ID}`);
                
                if (!response.ok) {
                    throw new Error('ไม่สามารถเชื่อมต่อ Web App');
                }

                const data = await response.json();
                
                if (data.success && data.folders) {
                    renderGallery(data.folders);
                } else {
                    throw new Error(data.error || 'ไม่พบข้อมูล');
                }
            } catch (error) {
                console.log('Web App ยังไม่ตอบสนอง ลองดึงข้อมูลอื่น...');
                // Fallback: ดึงข้อมูลจาก Google Drive API (public folder)
                await loadGalleryFallback();
            }
        }

        async function loadGalleryFallback() {
            try {
                // ใช้ Google Drive API โดยตรง (public access)
                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}' in parents and mimeType='application/vnd.google-apps.folder'&fields=files(id,name)&key=AIzaSyDxyzAbc123`
                );

                // ถ้า API key ไม่ถูก ให้แสดงข้อมูลเบื้องต้น
                document.getElementById('galleryView').innerHTML = `
                    <div class="card text-center">
                        <h2 class="text-2xl font-bold gradient-text mb-4">📸 แกลเลอรีกิจกรรม</h2>
                        <p class="mb-4">🔧 Web App URL ยังไม่พร้อม</p>
                        <p class="text-sm text-gray-600">
                            💡 ให้ Google Apps Script Web App URL<br>
                            return JSON format:<br>
                            { "success": true, "folders": [ { "id": "...", "name": "...", "images": [...] } ] }
                        </p>
                        <div class="mt-6 p-4 bg-yellow-100 rounded-lg">
                            <p class="font-bold mb-2">⚙️ ตั้งค่า:</p>
                            <p class="text-xs font-mono break-all">
                                Sheet ID: ${SHEET_ID}<br>
                                Folder ID: ${FOLDER_ID}<br>
                                Web App: ${WEB_APP_URL}
                            </p>
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('galleryView').innerHTML = `
                    <div class="card text-center text-red-500">
                        <p class="text-2xl font-bold mb-2">❌ ข้อผิดพลาด</p>
                        <p>${error.message}</p>
                        <div class="mt-4 p-4 bg-red-100 rounded-lg text-left text-sm">
                            <p class="font-bold mb-2">📝 ต้องสร้าง Google Apps Script</p>
                            <p class="mb-2">ไปที่ script.google.com แล้วสร้าง Script ใหม่:</p>
                            <pre class="bg-gray-800 text-green-400 p-2 rounded text-xs overflow-auto">function doGet(e) {
  const folderId = e.parameter.folderId || '${FOLDER_ID}';
  const action = e.parameter.action || 'getFolders';
  
  if (action === 'getFolders') {
    const folder = DriveApp.getFolderById(folderId);
    const subfolders = folder.getFolders();
    let result = [];
    
    while (subfolders.hasNext()) {
      const sf = subfolders.next();
      const images = [];
      const files = sf.getFiles();
      
      while (files.hasNext()) {
        const file = files.next();
        if (file.getMimeType().includes('image')) {
          images.push({
            id: file.getId(),
            name: file.getName()
          });
        }
      }
      
      result.push({
        id: sf.getId(),
        name: sf.getName(),
        images: images
      });
    }
    
    return ContentService.createTextOutput(JSON.stringify({
      success: true,
      folders: result
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  const action = e.parameter.action;
  
  if (action === 'createFolder') {
    const parentId = e.parameter.parentId;
    const folderName = e.parameter.folderName;
    const parent = DriveApp.getFolderById(parentId);
    const newFolder = parent.createFolder(folderName);
    
    return ContentService.createTextOutput(JSON.stringify({
      success: true,
      folderId: newFolder.getId()
    })).setMimeType(ContentService.MimeType.JSON);
  }
  
  return ContentService.createTextOutput(JSON.stringify({
    success: false,
    error: 'Unknown action'
  })).setMimeType(ContentService.MimeType.JSON);
}
</pre>
                        </div>
                    </div>
                `;
            }
        }

        function renderGallery(folders) {
            let html = '';
            
            folders.forEach(folder => {
                if (folder.images && folder.images.length > 0) {
                    html += `
                        <div class="mb-16">
                            <div class="card mb-8">
                                <h2 class="text-3xl font-bold gradient-text">📁 ${folder.name}</h2>
                                <p class="text-gray-600 mt-2">${folder.images.length} รูป</p>
                            </div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    `;
                    
                    folder.images.forEach(img => {
                        const imageUrl = `https://drive.google.com/thumbnail?id=${img.id}&sz=w500`;
                        html += `
                            <div class="image-card" onclick="openModal('${imageUrl}', '${img.name}')">
                                <img src="${imageUrl}" alt="${img.name}" onerror="this.src='https://via.placeholder.com/200?text=Loading'">
                            </div>
                        `;
                    });
                    
                    html += `</div></div>`;
                }
            });

            if (html === '') {
                html = '<div class="card text-center"><p class="text-2xl">📸 ยังไม่มีรูปภาพ</p></div>';
            }

            document.getElementById('galleryView').innerHTML = html;
        }

        function openModal(url, name) {
            document.getElementById('modalImage').src = url;
            document.getElementById('downloadBtn').href = url;
            document.getElementById('downloadBtn').download = name;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }
    </script>
</body>
</html>
