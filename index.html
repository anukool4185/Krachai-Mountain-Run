<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 แกลเลอรีกิจกรรม</title>
    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 40;
        }

        .main-content {
            padding-bottom: 80px;
        }

        @media (min-width: 768px) {
            .main-content {
                padding-bottom: 32px;
            }
        }

        .image-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 32px;
        }

        .image-card {
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        .image-card:hover {
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
            transform: scale(1.05);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
            color: white;
            opacity: 0;
        }

        .image-card:hover .image-overlay {
            background: rgba(0,0,0,0.4);
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 16px;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            position: relative;
        }

        .modal-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .hidden {
            display: none !important;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 767px) {
            .hidden-mobile {
                display: none !important;
            }
        }

        @media (min-width: 768px) {
            .hidden-desktop {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-50 to-white">
    <div id="app">
        <!-- Loading Screen -->
        <div id="loading" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
            <div class="text-center">
                <div class="inline-block p-4 mb-4">
                    <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full spin"></div>
                </div>
                <p class="text-gray-600">กำลังโหลดข้อมูล...</p>
            </div>
        </div>

        <!-- Header -->
        <header class="sticky top-0 z-40 bg-white shadow-md">
            <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-blue-600">📸 แกลเลอรีกิจกรรม</h1>
                    <p class="text-sm text-gray-600">ชมรูปภาพและเรื่องราวจากกิจกรรมต่างๆ</p>
                </div>
                
                <!-- Desktop Menu -->
                <nav class="hidden-mobile flex gap-4">
                    <button onclick="setCurrentPage('gallery')" id="btnGallery" class="px-4 py-2 rounded-lg font-medium transition bg-blue-600 text-white">
                        🖼️ แกลเลอรี
                    </button>
                    <button id="btnAdmin" onclick="setCurrentPage('admin')" class="px-4 py-2 rounded-lg font-medium transition bg-gray-200 text-gray-800 hover:bg-gray-300 hidden">
                        ⚙️ จัดการ
                    </button>
                    <button onclick="toggleAdmin()" class="px-4 py-2 rounded-lg font-medium bg-yellow-200 text-yellow-800 hover:bg-yellow-300 transition">
                        🔐 Admin
                    </button>
                </nav>

                <!-- Mobile Menu Button -->
                <button onclick="toggleMobileMenu()" class="hidden-desktop p-2 hover:bg-gray-200 rounded-lg">
                    <span class="text-2xl">☰</span>
                </button>
            </div>

            <!-- Mobile Menu -->
            <div id="mobileMenu" class="hidden-desktop bg-white border-t border-gray-200 px-4 py-3 flex flex-col gap-2 hidden">
                <button onclick="setCurrentPage('gallery'); toggleMobileMenu()" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100">
                    🖼️ แกลเลอรี
                </button>
                <button id="btnMobileAdmin" onclick="setCurrentPage('admin'); toggleMobileMenu()" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 hidden">
                    ⚙️ จัดการ
                </button>
                <button onclick="toggleAdmin()" class="w-full text-left px-4 py-2 rounded hover:bg-gray-100 font-medium text-yellow-600">
                    🔐 Admin
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-8 main-content">
            <div id="galleryContent"></div>
            <div id="adminContent" class="hidden"></div>
        </main>

        <!-- Image Popup -->
        <div id="imageModal" class="modal-overlay hidden" onclick="closeModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <button onclick="closeModal()" style="position: absolute; top: 12px; right: 12px; z-index: 10; background: white; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center;">✕</button>
                <img id="modalImage" src="" alt="" class="modal-image p-4">
                <div class="flex gap-3 p-4">
                    <button onclick="downloadImage()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium">
                        ⬇️ บันทึกรูป
                    </button>
                    <button onclick="closeModal()" class="flex-1 bg-gray-300 text-gray-800 py-2 rounded-lg hover:bg-gray-400 transition font-medium">
                        ปิด
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Bottom Navigation -->
        <nav class="hidden-desktop sticky-footer bg-white border-t border-gray-200 shadow-2xl">
            <div class="flex justify-around max-w-6xl mx-auto">
                <button onclick="setCurrentPage('gallery'); closeMobileMenu()" class="flex-1 py-3 flex flex-col items-center gap-1 transition text-blue-600 bg-blue-50 border-b-2 border-blue-600" id="navGallery">
                    <span style="font-size: 24px;">🖼️</span>
                    <span class="text-xs">แกลเลอรี</span>
                </button>
                
                <button id="navAdmin" onclick="setCurrentPage('admin'); closeMobileMenu()" class="flex-1 py-3 flex flex-col items-center gap-1 transition text-gray-600 hover:text-purple-600 hidden">
                    <span style="font-size: 24px;">⚙️</span>
                    <span class="text-xs">จัดการ</span>
                </button>
                
                <button onclick="toggleAdmin()" class="flex-1 py-3 flex flex-col items-center gap-1 transition text-gray-600 hover:text-yellow-600">
                    <span id="adminIcon" style="font-size: 24px;">🔐</span>
                    <span id="adminText" class="text-xs">Admin</span>
                </button>
            </div>
        </nav>
    </div>

    <script>
        let currentPage = 'gallery';
        let isAdmin = false;
        let imageSize = 300;
        let activities = [];
        let selectedImage = null;

        // Sample Data (จะถูกแทนที่ด้วยข้อมูลจาก Google Sheets)
        const sampleActivities = [
            {
                id: 1,
                title: '🎉 กิจกรรมวันสดใส',
                description: 'กิจกรรมสนุกสำหรับวัยหนุ่มสาว เพื่อสร้างความสนิทและเสริมสร้างจิตสำนึก',
                images: [
                    { id: '1', name: 'photo1.jpg', url: 'https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=800' },
                    { id: '2', name: 'photo2.jpg', url: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800' },
                    { id: '3', name: 'photo3.jpg', url: 'https://images.unsplash.com/photo-1517457373614-b7152f800fd1?w=800' },
                    { id: '4', name: 'photo4.jpg', url: 'https://images.unsplash.com/photo-1504609773096-104ff2176d46?w=800' }
                ]
            },
            {
                id: 2,
                title: '🎨 กิจกรรมสร้างสรรค์',
                description: 'พัฒนาทักษะและความสามารถโดยสร้างผลงานจากจินตนาการ',
                images: [
                    { id: '5', name: 'photo5.jpg', url: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=800' },
                    { id: '6', name: 'photo6.jpg', url: 'https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=800' },
                    { id: '7', name: 'photo7.jpg', url: 'https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=800' }
                ]
            },
            {
                id: 3,
                title: '🏆 กิจกรรมแข่งขัน',
                description: 'การแข่งขันอันสร้างสรรค์เพื่อค้นหาความแข็งแกร่ง',
                images: [
                    { id: '8', name: 'photo8.jpg', url: 'https://images.unsplash.com/photo-1552674605-5defe6aa44bb?w=800' },
                    { id: '9', name: 'photo9.jpg', url: 'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=800' }
                ]
            }
        ];

        // Initialize
        window.onload = function() {
            activities = sampleActivities;
            renderGallery();
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 500);
        };

        function setCurrentPage(page) {
            currentPage = page;
            document.getElementById('galleryContent').classList.toggle('hidden', page !== 'gallery');
            document.getElementById('adminContent').classList.toggle('hidden', page !== 'admin');
            
            if (page === 'gallery') {
                renderGallery();
                document.getElementById('navGallery').classList.add('text-blue-600', 'bg-blue-50', 'border-b-2', 'border-blue-600');
                document.getElementById('navGallery').classList.remove('text-gray-600', 'hover:text-blue-600');
                document.getElementById('navAdmin')?.classList.remove('text-purple-600', 'bg-purple-50', 'border-b-2', 'border-purple-600');
                document.getElementById('navAdmin')?.classList.add('text-gray-600', 'hover:text-purple-600');
            } else {
                renderAdmin();
                document.getElementById('navGallery').classList.remove('text-blue-600', 'bg-blue-50', 'border-b-2', 'border-blue-600');
                document.getElementById('navGallery').classList.add('text-gray-600', 'hover:text-blue-600');
                document.getElementById('navAdmin')?.classList.add('text-purple-600', 'bg-purple-50', 'border-b-2', 'border-purple-600');
                document.getElementById('navAdmin')?.classList.remove('text-gray-600', 'hover:text-purple-600');
            }
        }

        function renderGallery() {
            let html = '';
            activities.forEach(activity => {
                html += `
                    <div class="mb-12">
                        <div class="mb-6">
                            <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">${activity.title}</h2>
                            <p class="text-gray-600">${activity.description}</p>
                        </div>
                        <div class="image-grid" style="grid-template-columns: repeat(auto-fill, minmax(${imageSize}px, 1fr));">
                `;
                
                activity.images.forEach(img => {
                    html += `
                        <div class="image-card" onclick="openModal('${img.url}', '${img.name}')">
                            <img src="${img.url}" alt="${img.name}">
                            <div class="image-overlay">
                                <span class="text-sm font-medium">กดเพื่อขยาย</span>
                            </div>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('galleryContent').innerHTML = html;
        }

        function renderAdmin() {
            const html = `
                <div class="space-y-8">
                    <!-- ส่วนการเข้าสู่ระบบ Google -->
                    <div class="bg-white rounded-lg shadow-lg p-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">🔑 เชื่อมต่อ Google Drive</h2>
                        <div id="googleSignInBtn" class="mb-4"></div>
                        <div id="signInStatus" class="text-sm text-gray-600 hidden">
                            <p>✓ คุณได้ลงชื่อเข้าใช้แล้ว</p>
                            <button onclick="signOutGoogle()" class="mt-2 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                                ออกจากระบบ
                            </button>
                        </div>
                    </div>

                    <!-- ส่วนสร้างโฟลเดอร์ -->
                    <div class="bg-white rounded-lg shadow-lg p-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">📁 สร้างโฟลเดอร์ใหม่</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-lg font-medium text-gray-700 mb-2">
                                    ชื่อโฟลเดอร์
                                </label>
                                <input type="text" id="folderName" placeholder="เช่น: กิจกรรมวันสดใส" 
                                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
                            </div>

                            <div>
                                <label class="block text-lg font-medium text-gray-700 mb-2">
                                    โฟลเดอร์ Parent (ไม่บังคับ)
                                </label>
                                <input type="text" id="parentFolderId" placeholder="ตัวอย่าง: 1Ymln5xGCN2GjplQujJIcmHbOwFLAlMaI" 
                                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 text-sm">
                                <p class="text-xs text-gray-500 mt-1">ถ้าเว้นว่างจะสร้างที่โฟลเดอร์ My Drive</p>
                            </div>

                            <button onclick="createFolder()" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition font-medium">
                                ✨ สร้างโฟลเดอร์
                            </button>

                            <div id="folderMessage" class="hidden p-4 rounded-lg"></div>
                        </div>
                    </div>

                    <!-- ส่วนปรับขนาดรูป -->
                    <div class="bg-white rounded-lg shadow-lg p-8">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">⚙️ จัดการขนาดรูป</h2>
                        <div class="space-y-6">
                            <div>
                                <label class="block text-lg font-medium text-gray-700 mb-3">
                                    ขนาดรูปภาพ: <span id="sizeDisplay">300</span>px
                                </label>
                                <input type="range" min="150" max="500" value="300" 
                                       onchange="changeImageSize(this.value)" 
                                       class="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                                <div class="flex justify-between text-sm text-gray-500 mt-2">
                                    <span>150px</span>
                                    <span>500px</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ข้อมูลอ้างอิง -->
                    <div class="bg-green-50 rounded-lg shadow-lg p-8">
                        <h3 class="text-xl font-bold text-gray-800 mb-4">📊 ข้อมูล API</h3>
                        <div class="space-y-3 text-sm text-gray-700 font-mono bg-white p-4 rounded">
                            <p><strong>Sheet ID:</strong> <span class="text-blue-600 break-all">1awRAkSlzYyu2aBnr4cof0JX7fxNoDcoGOeOlfIoSTbU</span></p>
                            <p><strong>Folder ID:</strong> <span class="text-blue-600 break-all">1Ymln5xGCN2GjplQujJIcmHbOwFLAlMaI</span></p>
                            <p><strong>Drive Status:</strong> <span id="driveStatus" class="text-red-600">⚠️ ไม่เชื่อมต่อ</span></p>
                        </div>
                    </div>

                    <!-- วิธีการตั้งค่า -->
                    <div class="bg-blue-50 rounded-lg shadow-lg p-8">
                        <h3 class="text-xl font-bold text-gray-800 mb-4">⚙️ วิธีการตั้งค่า Google API</h3>
                        <div class="space-y-4 text-sm text-gray-700">
                            <div>
                                <strong class="text-blue-900">1️⃣ สร้าง Google Cloud Project:</strong>
                                <ol class="list-decimal list-inside ml-4 mt-2 space-y-1">
                                    <li>ไปที่ <a href="https://console.cloud.google.com/" target="_blank" class="text-blue-600 underline">Google Cloud Console</a></li>
                                    <li>สร้าง Project ใหม่</li>
                                    <li>Enable APIs: Google Drive API, Google Sheets API</li>
                                </ol>
                            </div>
                            <div>
                                <strong class="text-blue-900">2️⃣ สร้าง OAuth 2.0 Client ID:</strong>
                                <ol class="list-decimal list-inside ml-4 mt-2 space-y-1">
                                    <li>ไปที่ Credentials → Create → OAuth 2.0 Client ID</li>
                                    <li>Type: Web application</li>
                                    <li>Authorized redirect URIs:
                                        <div class="bg-white p-2 mt-1 rounded font-mono text-xs">
                                            http://localhost:8000<br>
                                            https://YOUR_DOMAIN.com
                                        </div>
                                    </li>
                                    <li>Copy Client ID และใส่ในบรรทัด 425 ของ index.html</li>
                                </ol>
                            </div>
                            <div>
                                <strong class="text-blue-900">3️⃣ สร้าง API Key:</strong>
                                <ol class="list-decimal list-inside ml-4 mt-2 space-y-1">
                                    <li>ไปที่ Credentials → Create → API Key</li>
                                    <li>Copy API Key และใส่ในบรรทัด 426 ของ index.html</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('adminContent').innerHTML = html;
            initializeGoogleSignIn();
        }

        let googleAccessToken = null;

        // ===== ขั้นตอนการตั้งค่า Google OAuth =====
        // 1. ไปที่ https://console.cloud.google.com/
        // 2. สร้าง OAuth 2.0 Client ID (type: Web application)
        // 3. เพิ่ม Authorized redirect URIs:
        //    - http://localhost:8000
        //    - https://YOUR_DOMAIN.com
        // 4. Copy Client ID ใส่ที่บรรทัดที่มี 'YOUR_CLIENT_ID_HERE'
        // 5. Enable scopes: https://www.googleapis.com/auth/drive.file
        // 6. สร้าง API Key สำหรับ REST API
        // 7. Copy API Key ใส่ที่บรรทัดที่มี 'YOUR_API_KEY_HERE'
        // =========================================

        const GOOGLE_CLIENT_ID = 'YOUR_CLIENT_ID_HERE'; // ← ใส่ Client ID ของคุณที่นี่
        const GOOGLE_API_KEY = 'YOUR_API_KEY_HERE'; // ← ใส่ API Key ของคุณที่นี่

        function initializeGoogleSignIn() {
            if (GOOGLE_CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
                document.getElementById('googleSignInBtn').innerHTML = `
                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded">
                        <p class="font-medium text-yellow-800">⚠️ ต้องตั้งค่า Google Client ID ก่อน</p>
                        <p class="text-sm text-yellow-700 mt-1">ดูวิธีการตั้งค่า → ด้านล่าง ⬇️</p>
                    </div>
                `;
                return;
            }

            window.google?.accounts?.id?.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse
            });

            window.google?.accounts?.id?.renderButton(
                document.getElementById('googleSignInBtn'),
                { 
                    theme: 'outline', 
                    size: 'large',
                    text: 'signup_with'
                }
            );
        }

        function handleCredentialResponse(response) {
            // ดึง Access Token สำหรับ Google Drive API
            fetch('https://oauth2.googleapis.com/tokeninfo?id_token=' + response.credential)
                .then(res => res.json())
                .then(data => {
                    console.log('Signed in:', data);
                    document.getElementById('googleSignInBtn').classList.add('hidden');
                    document.getElementById('signInStatus').classList.remove('hidden');
                    document.getElementById('driveStatus').innerHTML = '<span class="text-green-600">✓ เชื่อมต่อแล้ว</span>';
                    // หลังลงชื่อเข้าใช้ ใช้ Google Drive API
                    getAccessTokenForDrive();
                })
                .catch(err => {
                    console.log('ต้องใช้ Client ID จริง:', err);
                    // ถ้าไม่มี Client ID ให้ทำงานแบบ offline
                    document.getElementById('googleSignInBtn').innerHTML = '<p class="text-blue-600 text-sm">ต้องตั้งค่า Google Client ID ก่อนใช้งาน</p>';
                });
        }

        function getAccessTokenForDrive() {
            // ในการใช้งานจริง ต้องเรียก Google OAuth flow ให้ได้ access token
            // ลองขอ scopes ที่ต้องการ
            const scopes = ['https://www.googleapis.com/auth/drive.file'];
            window.google?.accounts?.oauth2?.initCodeClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: scopes.join(' '),
                ux_mode: 'popup',
                callback: (response) => {
                    console.log('Authorization code:', response);
                }
            }).requestCode();
        }

        function signOutGoogle() {
            window.google?.accounts?.id?.disableAutoSelect();
            googleAccessToken = null;
            document.getElementById('googleSignInBtn').classList.remove('hidden');
            document.getElementById('signInStatus').classList.add('hidden');
            document.getElementById('driveStatus').innerHTML = '<span class="text-red-600">⚠️ ไม่เชื่อมต่อ</span>';
        }

        function createFolder() {
            const folderName = document.getElementById('folderName').value.trim();
            const parentFolderId = document.getElementById('parentFolderId').value.trim();
            const message = document.getElementById('folderMessage');

            if (!folderName) {
                message.className = 'p-4 rounded-lg bg-red-100 text-red-800';
                message.textContent = '❌ กรุณาใส่ชื่อโฟลเดอร์';
                message.classList.remove('hidden');
                return;
            }

            if (!googleAccessToken && GOOGLE_API_KEY === 'YOUR_API_KEY_HERE') {
                message.className = 'p-4 rounded-lg bg-yellow-100 text-yellow-800';
                message.innerHTML = `
                    ⚠️ ยังไม่ได้ตั้งค่า API Key<br>
                    <small>กรุณาตั้งค่า Google API Key ให้เสร็จก่อน (ดูด้านล่าง)</small>
                `;
                message.classList.remove('hidden');
                return;
            }

            // ตัวอย่างการใช้ Google Drive API
            const metadata = {
                name: folderName,
                mimeType: 'application/vnd.google-apps.folder'
            };

            if (parentFolderId) {
                metadata.parents = [parentFolderId];
            }

            // ในการใช้งานจริง ต้องมี access token จริง
            fetch('https://www.googleapis.com/drive/v3/files?key=' + GOOGLE_API_KEY, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${googleAccessToken}`
                },
                body: JSON.stringify(metadata)
            })
            .then(response => response.json())
            .then(data => {
                if (data.id) {
                    message.className = 'p-4 rounded-lg bg-green-100 text-green-800';
                    message.innerHTML = `
                        ✅ สร้างโฟลเดอร์สำเร็จ!<br>
                        <strong>Folder ID:</strong> <span class="font-mono break-all">${data.id}</span><br>
                        <small class="text-green-700">คัดลอก Folder ID นี้ไปใส่ใน Google Sheets</small>
                    `;
                    document.getElementById('folderName').value = '';
                    document.getElementById('parentFolderId').value = '';
                } else {
                    throw new Error(data.error?.message || 'สร้างโฟลเดอร์ไม่สำเร็จ');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                message.className = 'p-4 rounded-lg bg-yellow-100 text-yellow-800';
                message.innerHTML = `
                    ⚠️ ไม่สามารถสร้างโฟลเดอร์ผ่าน API ได้<br>
                    <small>${error.message}</small><br>
                    <br>
                    <strong>วิธีสร้างทางเลือก:</strong><br>
                    1. ไปที่ <a href="https://drive.google.com/drive/folders/1Ymln5xGCN2GjplQujJIcmHbOwFLAlMaI" target="_blank" class="underline text-blue-600">Google Drive</a><br>
                    2. สร้างโฟลเดอร์ชื่อ "${folderName}"<br>
                    3. คัดลอก Folder ID จาก URL
                `;
            });
            message.classList.remove('hidden');
        }

        function openModal(imageUrl, imageName) {
            selectedImage = { url: imageUrl, name: imageName };
            document.getElementById('modalImage').src = imageUrl;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeModal(e) {
            if (e && e.target !== document.getElementById('imageModal')) return;
            document.getElementById('imageModal').classList.add('hidden');
            selectedImage = null;
        }

        function downloadImage() {
            if (!selectedImage) return;
            const link = document.createElement('a');
            link.href = selectedImage.url;
            link.download = selectedImage.name;
            link.click();
        }

        function toggleAdmin() {
            if (!isAdmin) {
                // ขอรหัสเข้าสู่โหมดแอดมิน
                const password = prompt('📌 ใส่รหัสแอดมิน:', '');
                
                if (password === '434143') {
                    isAdmin = true;
                    activateAdminMode();
                } else if (password !== null) {
                    alert('❌ รหัสไม่ถูกต้อง!');
                    return;
                } else {
                    return; // ยกเลิก
                }
            } else {
                // ออกจากโหมดแอดมิน
                isAdmin = false;
                deactivateAdminMode();
            }
        }

        function activateAdminMode() {
            const adminBtn = document.getElementById('btnAdmin');
            const mobileAdminBtn = document.getElementById('btnMobileAdmin');
            const navAdmin = document.getElementById('navAdmin');
            
            adminBtn?.classList.remove('hidden');
            mobileAdminBtn?.classList.remove('hidden');
            navAdmin?.classList.remove('hidden');
            document.getElementById('adminIcon').textContent = '👤';
            document.getElementById('adminText').textContent = 'ออกแอดมิน';
            setCurrentPage('admin');
        }

        function deactivateAdminMode() {
            const adminBtn = document.getElementById('btnAdmin');
            const mobileAdminBtn = document.getElementById('btnMobileAdmin');
            const navAdmin = document.getElementById('navAdmin');
            
            adminBtn?.classList.add('hidden');
            mobileAdminBtn?.classList.add('hidden');
            navAdmin?.classList.add('hidden');
            document.getElementById('adminIcon').textContent = '🔐';
            document.getElementById('adminText').textContent = 'Admin';
            setCurrentPage('gallery');
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        }

        function changeImageSize(size) {
            imageSize = parseInt(size);
            document.getElementById('sizeDisplay').textContent = imageSize;
            renderGallery();
        }

        function closeMobileMenu() {
            document.getElementById('mobileMenu').classList.add('hidden');
        }
    </script>
</body>
</html>
